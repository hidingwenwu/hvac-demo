<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>趋势分析</title>
<link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css">
</head>
<body>
<div class="energy-page">
  <div class="energy-head"><div class="energy-head-copy"><h1>趋势分析</h1></div></div>
  <div class="energy-filter"><div class="fb">
    <div class="fi"><span class="fl">统计对象</span><span id="objBox"></span></div>
    <div class="fi"><span class="fl">时间粒度</span><select id="granularity" style="width:100px"></select></div>
    <div class="fi"><span class="fl">时间范围</span><span id="rangeBox"></span></div>
    <button class="btn btnp" id="queryBtn">查询</button><button class="btn" id="resetBtn">重置</button><button class="btn" id="exportBtn">导出</button>
  </div></div>
  <div class="energy-summary">
    <div class="energy-summary-item"><div class="energy-summary-label">总能耗</div><div class="energy-summary-value" id="sumTotal" data-value="0">--</div></div>
    <div class="energy-summary-item"><div class="energy-summary-label">周期均值</div><div class="energy-summary-value" id="sumAverage">--</div></div>
    <div class="energy-summary-item"><div class="energy-summary-label">最大值</div><div class="energy-summary-value" id="sumMax">--</div></div>
    <div class="energy-summary-item"><div class="energy-summary-label">最小值</div><div class="energy-summary-value" id="sumMin">--</div></div>
  </div>
  <section class="energy-panel" style="margin-bottom:14px"><div class="energy-panel-head"><div><div class="energy-panel-title" id="chartTitle">项目整体能耗趋势</div></div></div><div class="energy-chart lg" id="trendChart"></div></section>
  <div class="tw"><table><thead><tr><th>时间</th><th>能耗(kWh)</th><th>环比期能耗(kWh)</th><th>环比</th><th>同比期能耗(kWh)</th><th>同比</th></tr></thead><tbody id="trendRows"></tbody></table></div>
  <div id="pager"></div>
</div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_allocation.js"></script><script src="_energy-data.js"></script><script src="_energy-filter.js"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
var energy=window.HvacEnergy,chart=null,result=null,selectedObj='project',dataWindow=energy.getDataWindow();
var params=new URLSearchParams(location.search);
var state={granularity:params.get('gran')||'day',from:params.get('from')||dataWindow.to.slice(0,8)+'01',to:params.get('to')||dataWindow.to,obj:params.get('obj')||'project'};
var pg={total:0,page:1,size:10,sizes:[10,20,30,50],onChange:function(){renderTable();}};
function fmt(v,d){return energy.formatNumber(v,d==null?1:d);}
var RANGE_MODE={hour:'single',day:'date',month:'month',year:'year'};
var rangePicker=$erange('rangeBox',{mode:RANGE_MODE[state.granularity]||'date',from:state.from,to:state.to,min:dataWindow.from,max:dataWindow.to,onChange:function(range){state.from=range.from;state.to=range.to;}});
var objSelector=$eobj('objBox',{types:['project','building','floor','room','tenant','group','meter'],onChange:function(id){selectedObj=id;}});
function fillGranularities(){var items=energy.getGranularities();document.getElementById('granularity').innerHTML=items.map(function(item){return '<option value="'+item.value+'">'+item.label+'</option>';}).join('');if(!items.some(function(item){return item.value===state.granularity;}))state.granularity='day';document.getElementById('granularity').value=state.granularity;}
function applyInitial(){fillGranularities();rangePicker.setMode(RANGE_MODE[state.granularity]||'date');rangePicker.setRange(state.from,state.to);var resolved=energy.resolveObject(state.obj);if(!resolved&&state.obj!=='project'){$msg('下钻对象已失效，已切换为项目整体','warning');state.obj='project';}objSelector.setValue(state.obj);selectedObj=state.obj;}
function query(){
  var gran=document.getElementById('granularity').value,range=rangePicker.getRange();
  var from=range.from,to=range.to;
  if(gran==='hour')to=from;
  var normalized=energy.normalizeRange(gran,from,to);
  if(normalized.truncated)$msg('查询范围过大，已自动截断','warning');
  from=normalized.from;to=normalized.to;
  if(gran==='hour'){from=String(from).slice(0,10);to=from;}
  state.from=from;state.to=to;state.granularity=gran;
  result=energy.queryComparison({obj:selectedObj||'project',granularity:gran,from:from,to:to});
  renderSummary();renderChart();pg.page=1;pg.total=result.rows.length;$pager('pager',pg);renderTable();
}
function renderSummary(){var s=result.current.summary;document.getElementById('sumTotal').dataset.value=s.total;document.getElementById('sumTotal').textContent=fmt(s.total)+' kWh';document.getElementById('sumAverage').textContent=fmt(s.average)+' kWh';document.getElementById('sumMax').textContent=fmt(s.max)+' kWh';document.getElementById('sumMin').textContent=fmt(s.min)+' kWh';document.getElementById('chartTitle').textContent=result.current.object.name+' 能耗趋势';}
function comparisonSeries(name,comparison,color){var values=comparison.points.map(function(point){return point.energy;});if(!values.some(function(value){return value!=null;}))return null;return {name:name,type:'line',smooth:true,showSymbol:false,data:values,lineStyle:{color:color,width:2}};}
function renderChart(){
  var el=document.getElementById('trendChart'),series=[{name:'本期',type:'bar',data:result.current.points.map(function(point){return point.energy;}),barMaxWidth:22,itemStyle:{borderRadius:[3,3,0,0],color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#9fd4ff'},{offset:.5,color:'#4d94f5'},{offset:1,color:'#1b4fd0'}]}}}];
  var momSeries=comparisonSeries('环比期',result.pointMom,'#67c23a');if(momSeries)series.push(momSeries);
  var yoySeries=comparisonSeries('同比期',result.pointYoy,'#e6a23c');if(yoySeries)series.push(yoySeries);
  var option={tooltip:{trigger:'axis'},grid:{left:55,right:28,top:38,bottom:40},xAxis:{type:'category',data:result.current.points.map(function(point){return point.label;}),axisLabel:{color:'#8492ad',hideOverlap:true},axisLine:{lineStyle:{color:'#35415f'}}},yAxis:{type:'value',name:'kWh',nameTextStyle:{color:'#8492ad'},axisLabel:{color:'#8492ad'},splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}}},series:series};
  if(series.length>1)option.legend={top:0,textStyle:{color:'#aab5ca'}};
  if(!window.echarts){el.innerHTML='<div class="energy-chart-fallback">图表资源未加载，请联网后刷新<br>下方明细数据仍可使用</div>';return;}
  if(!chart)chart=echarts.init(el);chart.setOption(option,true);
}
function rateCell(value){if(value==null)return '<td>--</td>';var className=value>0?'energy-up':value<0?'energy-down':'',arrow=value>0?'↑ ':value<0?'↓ ':'';return '<td class="'+className+'">'+arrow+Math.abs(value).toFixed(1)+'%</td>';}
function energyCell(value){return '<td>'+(value==null?'--':fmt(value))+'</td>';}
function renderTable(){var start=(pg.page-1)*pg.size,rows=result.rows.slice(start,start+pg.size);document.getElementById('trendRows').innerHTML=rows.map(function(row){return '<tr><td>'+row.label+'</td><td data-energy="'+row.current+'">'+fmt(row.current)+'</td>'+energyCell(row.mom)+rateCell(row.momRate)+energyCell(row.yoy)+rateCell(row.yoyRate)+'</tr>';}).join('')||'<tr><td colspan="6"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';}
document.getElementById('granularity').onchange=function(){
  var gran=this.value,range=rangePicker.getRange();
  if(gran==='hour')rangePicker.setRange(range.to,range.to);
  else if(RANGE_MODE[state.granularity]==='single')rangePicker.setRange(range.to.slice(0,8)+'01',range.to);
  rangePicker.setMode(RANGE_MODE[gran]||'date');
};
document.getElementById('queryBtn').onclick=query;
document.getElementById('resetBtn').onclick=function(){state={granularity:'day',from:dataWindow.to.slice(0,8)+'01',to:dataWindow.to,obj:'project'};applyInitial();query();};
document.getElementById('exportBtn').onclick=function(){$msg('导出任务已生成，请稍候下载');};
window.addEventListener('resize',function(){if(chart)chart.resize();});
applyInitial();query();
</script>
</body>
</html>
