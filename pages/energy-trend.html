<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>趋势分析</title>
<link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css">
</head>
<body>
<div class="energy-main-layout">
  <aside class="side-tree" id="buildingTree"><div class="st-title">建筑物信息</div><div id="tree"></div></aside>
  <main class="energy-main">
    <div class="energy-head"><h1>趋势分析</h1><div class="energy-head-meta">任意对象 · 任意时间粒度 · 单序列分析</div></div>
    <div class="energy-filter">
      <div class="fb">
        <div class="fi"><span class="fl">统计对象</span><select id="objectType" style="width:124px"><option value="project">项目整体</option><option value="building">楼栋</option><option value="floor">楼层</option><option value="room">房间</option><option value="tenant">租户</option><option value="system">空调系统</option><option value="group">群组</option><option value="meter">电表</option></select><select id="objectSelect" style="width:180px;display:none"></select></div>
        <div class="fi"><span class="fl">时间粒度</span><select id="granularity" style="width:100px"><option value="hour">按时</option><option value="day">按日</option><option value="week">按周</option><option value="month">按月</option><option value="year">按年</option></select></div>
        <div class="fi"><span class="fl">快捷范围</span><select id="quickRange" style="width:100px"><option value="custom">自定义</option><option value="today">今日</option><option value="yesterday">昨日</option><option value="week">本周</option><option value="month">本月</option><option value="lastMonth">上月</option><option value="year">本年</option></select></div>
        <div class="fi"><span class="fl">时间范围</span><input id="dateFrom" type="date" style="width:145px"><span class="text-sub">至</span><input id="dateTo" type="date" style="width:145px"></div>
        <div class="fi"><span class="fl">指标</span><select id="metric" style="width:100px"><option value="energy">能耗</option><option value="runtime">运行时长</option></select></div>
        <label class="fi"><input id="overlayMom" type="checkbox"> 环比期</label><label class="fi"><input id="overlayYoy" type="checkbox"> 同比期</label><label class="fi"><input id="overlayTemp" type="checkbox"> 室外温度</label>
        <button class="btn btnp" id="queryBtn">查询</button><button class="btn" id="resetBtn">重置</button><button class="btn" id="exportBtn">⬆ 导出</button>
      </div>
    </div>
    <div class="energy-summary">
      <div class="energy-summary-item"><div class="energy-summary-label" id="sumTotalLabel">总能耗</div><div class="energy-summary-value" id="sumTotal" data-value="0">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">周期均值</div><div class="energy-summary-value" id="sumAverage">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">最大值</div><div class="energy-summary-value" id="sumMax">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">最小值</div><div class="energy-summary-value" id="sumMin">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">同比</div><div class="energy-summary-value energy-down">↓ 2.1%</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">环比</div><div class="energy-summary-value energy-up">↑ 5.2%</div></div>
    </div>
    <section class="energy-panel" style="margin-bottom:14px"><div class="energy-panel-head"><div><div class="energy-panel-title" id="chartTitle">项目整体能耗趋势</div><div class="energy-panel-sub" id="rangeNote"></div></div></div><div class="energy-chart lg" id="trendChart"></div></section>
    <div class="energy-note">本页面专注能耗与运行指标，支持按对象、时间粒度及对比周期分析。</div>
    <div class="tw"><table><thead><tr><th>时间</th><th>能耗(kWh)</th><th>环比</th><th>同比</th><th id="runtimeHead">运行时长(h)</th></tr></thead><tbody id="trendRows"></tbody></table></div>
    <div id="pager"></div>
  </main>
</div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_allocation.js"></script><script src="_energy-data.js"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
var energy=window.HvacEnergy,chart=null,result=null,selectedObj='project',treeSel=null,lastChartOption=null;
var params=new URLSearchParams(location.search);
var state={granularity:params.get('gran')||'day',from:params.get('from')||'2026-07-15',to:params.get('to')||'2026-08-13',obj:params.get('obj')||'project',metric:params.get('metric')==='runtime'?'runtime':'energy'};
var pg={total:0,page:1,size:10,sizes:[10,20,30,50],onChange:function(){renderTable();}};
function fmt(v,d){return energy.formatNumber(v,d);}
function objectTypeFromId(id){return id==='project'?'project':String(id).split(':')[0];}
function renderTree(){var rooms=energy.getCatalog('room').map(function(r){return {bld:r.bld,fl:r.fl,room:r.room};});$tree3('tree',$tree3From(rooms),function(sel){treeSel=sel;if(!sel){selectedObj='project';return;}selectedObj=sel.room?'room:'+sel.bld+'|'+sel.fl+'|'+sel.room:sel.fl?'floor:'+sel.bld+'|'+sel.fl:'building:'+sel.bld;});}
function fillObjects(type){var select=document.getElementById('objectSelect');select.multiple=type==='meter';select.size=type==='meter'?4:1;if(type==='project'||['building','floor','room'].includes(type)){select.style.display='none';document.getElementById('buildingTree').style.display='block';selectedObj='project';return;}document.getElementById('buildingTree').style.display='none';select.style.display='';var rows=energy.getCatalog(type);select.innerHTML=rows.length?rows.map(function(item){return '<option value="'+item.id+'">'+item.name+(item.invalidCount?'（'+item.invalidCount+' 个成员失效）':'')+'</option>';}).join(''):'<option value="">暂无可选对象</option>';if(rows.length){var wanted=rows.some(function(item){return item.id===state.obj;})?state.obj:rows[0].id;select.value=wanted;selectedObj=wanted;}}
function dateText(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');}
function monthEnd(value){var parts=value.split('-');return dateText(new Date(Number(parts[0]),Number(parts[1]),0));}
function syncDateInputs(from,to){var gran=document.getElementById('granularity').value,fromEl=document.getElementById('dateFrom'),toEl=document.getElementById('dateTo'),fromText=String(from||''),toText=String(to||'');if(gran==='month'){fromEl.type=toEl.type='month';fromEl.removeAttribute('min');fromEl.removeAttribute('max');toEl.removeAttribute('min');toEl.removeAttribute('max');fromEl.value=/^\d{4}$/.test(fromText)?fromText+'-01':fromText.slice(0,7);toEl.value=/^\d{4}$/.test(toText)?toText+'-12':toText.slice(0,7);}else if(gran==='year'){fromEl.type=toEl.type='number';fromEl.min=toEl.min='2024';fromEl.max=toEl.max='2026';fromEl.step=toEl.step='1';fromEl.value=fromText.slice(0,4)||'2026';toEl.value=toText.slice(0,4)||'2026';}else{fromEl.type=toEl.type='date';fromEl.removeAttribute('min');fromEl.removeAttribute('max');toEl.removeAttribute('min');toEl.removeAttribute('max');fromEl.value=/^\d{4}$/.test(fromText)?fromText+'-01-01':/^\d{4}-\d{2}$/.test(fromText)?fromText+'-01':fromText.slice(0,10);toEl.value=/^\d{4}$/.test(toText)?toText+'-12-31':/^\d{4}-\d{2}$/.test(toText)?monthEnd(toText):toText.slice(0,10);}}
function inputRange(){var gran=document.getElementById('granularity').value,from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value;if(gran==='month')return {from:from+'-01',to:monthEnd(to)};if(gran==='year')return {from:from+'-01-01',to:to+'-12-31'};return {from:from,to:to};}
function applyQuickRange(){var preset=this.value,gran=document.getElementById('granularity').value;if(preset==='custom')return;var dates={today:['2026-08-13','2026-08-13'],yesterday:['2026-08-12','2026-08-12'],week:['2026-08-10','2026-08-13'],month:['2026-08-01','2026-08-13'],lastMonth:['2026-07-01','2026-07-31'],year:['2026-01-01','2026-08-13']},range=dates[preset];syncDateInputs(range[0],range[1]);}
function syncOverlayAvailability(){var enabled=['hour','day'].indexOf(document.getElementById('granularity').value)>=0,temp=document.getElementById('overlayTemp');temp.disabled=!enabled;if(!enabled)temp.checked=false;}
function applyInitial(){document.getElementById('granularity').value=state.granularity;syncDateInputs(state.from,state.to);syncOverlayAvailability();document.getElementById('metric').value=state.metric;var resolved=energy.resolveObject(state.obj),type=resolved?objectTypeFromId(state.obj):'project';if(!resolved&&state.obj!=='project'){$msg('下钻对象已失效，已切换为项目整体','warning');state.obj='project';}document.getElementById('objectType').value=type;fillObjects(type);if(type!=='project'&&state.obj)selectedObj=state.obj;}
function query(){var gran=document.getElementById('granularity').value,inputs=inputRange();var range=energy.normalizeRange(gran,inputs.from,inputs.to);if(range.truncated)$msg('最长可查询 '+range.pointCount+' 个点位，已自动截断','warning');syncDateInputs(range.from,range.to);result=energy.queryTrend({obj:selectedObj||'project',granularity:gran,from:range.from,to:range.to});renderSummary();renderChart();pg.page=1;pg.total=result.points.length;$pager('pager',pg);renderTable();}
function metricMeta(){var metric=document.getElementById('metric').value;return metric==='runtime'?{key:'runtime',name:'运行时长',totalLabel:'总运行时长',unit:'h'}:{key:'energy',name:'能耗',totalLabel:'总能耗',unit:'kWh'};}
function renderSummary(){var s=result.summary,meta=metricMeta(),values=result.points.map(function(point){return Number(point[meta.key]||0);}),total=meta.key==='energy'?s.total:s.runtime,average=values.length?values.reduce(function(sum,value){return sum+value;},0)/values.length:0,max=values.length?Math.max.apply(null,values):null,min=values.length?Math.min.apply(null,values):null,unit=' '+meta.unit;document.getElementById('sumTotalLabel').textContent=meta.totalLabel;document.getElementById('sumTotal').dataset.value=total;document.getElementById('sumTotal').textContent=fmt(total)+unit;document.getElementById('sumAverage').textContent=fmt(average)+unit;document.getElementById('sumMax').textContent=fmt(max)+unit;document.getElementById('sumMin').textContent=fmt(min)+unit;document.getElementById('chartTitle').textContent=result.object.name+' '+meta.name+'趋势';document.getElementById('rangeNote').textContent=result.range.from+' 至 '+result.range.to+' · '+result.range.label;}
function renderChart(){var el=document.getElementById('trendChart'),meta=metricMeta();var values=result.points.map(function(p){return p[meta.key];});var series=[{name:'本期',type:'bar',data:values,barMaxWidth:22,itemStyle:{borderRadius:[3,3,0,0],color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#9fd4ff'},{offset:.5,color:'#4d94f5'},{offset:1,color:'#1b4fd0'}]}}}];if(document.getElementById('overlayMom').checked)series.push({name:'环比期',type:'line',smooth:true,data:values.map(function(v,i){return +(v*(.92+(i%4)*.02)).toFixed(2);}),lineStyle:{color:'#67c23a'}});if(document.getElementById('overlayYoy').checked)series.push({name:'同比期',type:'line',smooth:true,data:values.map(function(v,i){return +(v*(1.02-(i%3)*.015)).toFixed(2);}),lineStyle:{color:'#e6a23c'}});var yAxis=[{type:'value',name:meta.unit,nameTextStyle:{color:'#8492ad'},axisLabel:{color:'#8492ad'},splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}}}];if(document.getElementById('overlayTemp').checked){yAxis.push({type:'value',name:'℃',min:0,max:40,nameTextStyle:{color:'#8492ad'},axisLabel:{color:'#8492ad'},splitLine:{show:false}});series.push({name:'室外温度',type:'line',yAxisIndex:1,smooth:true,showSymbol:false,data:result.points.map(function(_,i){return +(26+Math.sin(i/3)*3.8).toFixed(1);}),lineStyle:{color:'#f56c6c'}});}lastChartOption={tooltip:{trigger:'axis'},legend:{top:0,textStyle:{color:'#aab5ca'}},grid:{left:55,right:55,top:38,bottom:40},xAxis:{type:'category',data:result.points.map(function(p){return p.label;}),axisLabel:{color:'#8492ad',hideOverlap:true},axisLine:{lineStyle:{color:'#35415f'}}},yAxis:yAxis,series:series};if(!window.echarts){el.innerHTML='<div class="energy-chart-fallback">图表资源未加载，请联网后刷新<br>下方明细数据仍可使用</div>';return;}if(!chart)chart=echarts.init(el);chart.setOption(lastChartOption,true);}
function renderTable(){var hourly=result.range.granularity==='hour';document.getElementById('runtimeHead').style.display=hourly?'none':'';var start=(pg.page-1)*pg.size;var rows=result.points.slice(start,start+pg.size);document.getElementById('trendRows').innerHTML=rows.map(function(p,i){var mom=((i%5)-2)*2.4,yoy=((i%4)-1)*1.9;return '<tr><td>'+p.label+'</td><td data-energy="'+p.energy+'">'+fmt(p.energy)+'</td><td class="'+(mom>0?'energy-up':'energy-down')+'">'+(mom>0?'↑ ':'↓ ')+Math.abs(mom).toFixed(1)+'%</td><td class="'+(yoy>0?'energy-up':'energy-down')+'">'+(yoy>0?'↑ ':'↓ ')+Math.abs(yoy).toFixed(1)+'%</td>'+(hourly?'':'<td>'+fmt(p.runtime)+'</td>')+'</tr>';}).join('')||'<tr><td colspan="5"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';}
document.getElementById('objectType').onchange=function(){state.obj='';fillObjects(this.value);};document.getElementById('objectSelect').onchange=function(){if(this.multiple){var ids=Array.from(this.selectedOptions).map(function(option){return option.value.slice(6);});selectedObj='meter:'+ids.join(',');}else selectedObj=this.value;};document.getElementById('granularity').onchange=function(){var from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value;syncDateInputs(from,to);syncOverlayAvailability();document.getElementById('quickRange').value='custom';};document.getElementById('quickRange').onchange=applyQuickRange;document.getElementById('queryBtn').onclick=query;document.getElementById('resetBtn').onclick=function(){state={granularity:'day',from:'2026-07-15',to:'2026-08-13',obj:'project',metric:'energy'};document.getElementById('quickRange').value='custom';applyInitial();query();};document.getElementById('exportBtn').onclick=function(){$msg('导出任务已生成，请稍候下载');};['overlayMom','overlayYoy','overlayTemp'].forEach(function(id){document.getElementById(id).onchange=renderChart;});window.addEventListener('resize',function(){if(chart)chart.resize();});
renderTree();applyInitial();query();
</script>
</body>
</html>
