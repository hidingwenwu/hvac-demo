<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排行与结构</title><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css"></head>
<body>
<div class="energy-page">
  <div class="energy-head"><div class="energy-head-copy"><h1>排行与结构</h1></div></div>
  <div class="tabs"><div class="tab active" data-tab="rank">能耗排行</div><div class="tab" data-tab="structure">能耗结构</div></div>

  <section id="rankMode">
    <div class="energy-filter"><div class="fb">
      <div class="fi"><span class="fl">排行维度</span><select id="rankDimension"><option value="room">房间</option><option value="tenant">租户</option><option value="floor">楼层</option><option value="building">楼栋</option><option value="group">群组</option><option value="meter">电表</option></select></div>
      <div class="fi"><span class="fl">日期范围</span><span id="rankRangeBox"></span></div>
      <div class="fi"><span class="fl">范围</span><select id="rankLimit"><option value="10">TOP10</option><option value="20">TOP20</option><option value="50">TOP50</option><option value="999">全部</option></select></div>
      <div class="fi"><span class="fl">排序</span><select id="rankOrder"><option value="desc">倒序</option><option value="asc">正序</option></select></div>
      <button class="btn btnp" id="queryRank">查询</button><button class="btn" id="exportRank">导出</button>
    </div></div>
    <section class="energy-panel"><div class="energy-panel-head"><div><div class="energy-panel-title">能耗排行</div><div class="energy-panel-sub" id="rankSubtitle"></div></div></div><div class="energy-chart sm" id="rankChart"></div><div class="tw"><table><thead><tr><th>排名</th><th>对象</th><th>能耗(kWh)</th><th>占所选合计</th><th>同比</th><th>操作</th></tr></thead><tbody id="rankRows"></tbody></table></div></section>
  </section>

  <section id="structureMode" style="display:none">
    <div class="energy-filter"><div class="fb">
      <div class="fi"><span class="fl">日期范围</span><span id="structureRangeBox"></span></div>
      <button class="btn btnp" id="queryStructure">查询</button>
    </div></div>
    <section class="energy-panel"><div class="energy-panel-head"><div><div class="energy-panel-title">能耗结构</div><div class="energy-panel-sub" id="structureSubtitle"></div></div><div class="energy-segment"><button class="active" data-structure="tenant">租户</button><button data-structure="building">楼栋</button><button data-structure="floor">楼层</button><button data-structure="zone">公区/租户区</button></div></div><div class="energy-chart sm" id="structureChart"></div><div class="tw"><table><thead><tr><th>分组</th><th>能耗(kWh)</th><th>占比</th><th>较上期变化</th></tr></thead><tbody id="structureRows"></tbody><tfoot><tr class="energy-total-row"><td>合计</td><td id="structureTotal" data-value="0">--</td><td>100%</td><td>--</td></tr></tfoot></table></div></section>
  </section>
</div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_allocation.js"></script><script src="_energy-data.js"></script><script src="_energy-filter.js"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
var energy=HvacEnergy,rankChart=null,structureChart=null,rankData=null,structureData=null,dataWindow=energy.getDataWindow();
var params=new URLSearchParams(location.search);
function fmt(v,d){return energy.formatNumber(v,d==null?1:d);}
function monthStart(){return dataWindow.to.slice(0,8)+'01';}
var rankRange=$erange('rankRangeBox',{mode:'date',from:monthStart(),to:dataWindow.to,min:dataWindow.from,max:dataWindow.to});
var structureRange=$erange('structureRangeBox',{mode:'date',from:monthStart(),to:dataWindow.to,min:dataWindow.from,max:dataWindow.to});
function rateCell(value,suffix){if(value==null)return '<td>--</td>';var className=value>0?'energy-up':value<0?'energy-down':'',arrow=value>0?'↑ ':value<0?'↓ ':'';return '<td class="'+className+'">'+arrow+Math.abs(value).toFixed(1)+suffix+'</td>';}

/* ── 能耗排行 ── */
function renderRank(){
  var range=rankRange.getRange();
  rankData=energy.getRanking({dimension:document.getElementById('rankDimension').value,metric:'energy',from:range.from,to:range.to,limit:document.getElementById('rankLimit').value,order:document.getElementById('rankOrder').value});
  document.getElementById('rankSubtitle').textContent=document.getElementById('rankDimension').selectedOptions[0].text+' · '+range.from+' 至 '+range.to;
  document.getElementById('rankRows').innerHTML=rankData.rows.map(function(row,index){return '<tr><td>'+(index+1)+'</td><td>'+row.name+'</td><td data-value="'+row.energy+'">'+fmt(row.energy)+'</td><td>'+fmt(row.percent)+'%</td>'+rateCell(row.yoyRate,'%')+'<td><button class="energy-link" data-id="'+row.id+'">查看趋势</button></td></tr>';}).join('')||'<tr><td colspan="6"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';
  document.querySelectorAll('#rankRows .energy-link').forEach(function(btn){btn.onclick=function(){parent.postMessage({nav:'energy-trend',q:'gran=day&from='+range.from+'&to='+range.to+'&obj='+encodeURIComponent(btn.dataset.id)},'*');};});
  renderRankChart();
}
function renderRankChart(){
  if(!window.echarts){document.getElementById('rankChart').innerHTML='<div class="energy-chart-fallback">图表资源未加载，排行表仍可使用</div>';return;}
  rankChart=rankChart||echarts.init(document.getElementById('rankChart'));
  var rows=rankData.rows.slice().reverse();
  rankChart.setOption({grid:{left:90,right:30,top:10,bottom:25},tooltip:{trigger:'axis'},xAxis:{type:'value',axisLabel:{color:'#8492ad'},splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}}},yAxis:{type:'category',data:rows.map(function(r){return r.name;}),axisLabel:{color:'#aab5ca',width:80,overflow:'truncate'}},series:[{type:'bar',data:rows.map(function(r){return r.energy;}),barMaxWidth:14,itemStyle:{borderRadius:[0,4,4,0],color:'#409eff'}}]},true);
}

/* ── 能耗结构 ── */
var STRUCTURE_LABEL={tenant:'按租户',building:'按楼栋',floor:'按楼层',zone:'公区/租户区'},structureDimension='tenant';
function renderStructure(){
  var dimension=structureDimension,range=structureRange.getRange();
  structureData=energy.getStructure({dimension:dimension,from:range.from,to:range.to});
  document.getElementById('structureSubtitle').textContent=STRUCTURE_LABEL[dimension]+' · '+range.from+' 至 '+range.to;
  document.getElementById('structureRows').innerHTML=structureData.rows.map(function(row){return '<tr><td>'+row.name+'</td><td data-energy="'+row.energy+'">'+fmt(row.energy)+'</td><td>'+fmt(row.percent)+'%</td>'+rateCell(row.percentagePointChange,' 个百分点')+'</tr>';}).join('')||'<tr><td colspan="4"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';
  document.getElementById('structureTotal').dataset.value=structureData.total;
  document.getElementById('structureTotal').textContent=fmt(structureData.total);
  renderStructureChart();
}
function renderStructureChart(){
  if(!window.echarts){document.getElementById('structureChart').innerHTML='<div class="energy-chart-fallback">图表资源未加载，结构表仍可使用</div>';return;}
  structureChart=structureChart||echarts.init(document.getElementById('structureChart'));
  var palette=['#409eff','#36cfc9','#e6a23c','#67c23a','#909399','#9fd4ff','#b37feb','#5cdbd3'];
  structureChart.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{color:'#aab5ca'}},series:[{type:'pie',radius:['45%','68%'],center:['50%','43%'],label:{color:'#d8deeb',formatter:'{b}\n{d}%'},data:structureData.rows.map(function(row,index){return {name:row.name,value:row.energy,itemStyle:{color:palette[index%palette.length]}};})}]},true);
}

document.querySelectorAll('.tabs .tab').forEach(function(tab){tab.onclick=function(){document.querySelectorAll('.tabs .tab').forEach(function(item){item.classList.remove('active');});tab.classList.add('active');document.getElementById('rankMode').style.display=tab.dataset.tab==='rank'?'block':'none';document.getElementById('structureMode').style.display=tab.dataset.tab==='structure'?'block':'none';if(tab.dataset.tab==='structure'&&!structureData)renderStructure();};});
document.getElementById('queryRank').onclick=renderRank;
document.getElementById('queryStructure').onclick=renderStructure;
document.getElementById('exportRank').onclick=function(){$msg('导出任务已生成，请稍候下载');};
window.addEventListener('resize',function(){if(rankChart)rankChart.resize();if(structureChart)structureChart.resize();});
document.querySelectorAll('[data-structure]').forEach(function(btn){btn.onclick=function(){if(btn.dataset.structure===structureDimension)return;document.querySelectorAll('[data-structure]').forEach(function(item){item.classList.toggle('active',item===btn);});structureDimension=btn.dataset.structure;renderStructure();};});
if(params.get('dimension'))document.getElementById('rankDimension').value=params.get('dimension');
if(params.get('structure')){var sv=params.get('structure'),sb=document.querySelector('[data-structure="'+sv+'"]');if(sb){structureDimension=sv;document.querySelectorAll('[data-structure]').forEach(function(item){item.classList.toggle('active',item===sb);});}document.querySelector('.tab[data-tab="structure"]').click();}
renderRank();
</script>
</body></html>
