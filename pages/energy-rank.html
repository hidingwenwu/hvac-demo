<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排行与结构</title><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css"></head>
<body><div class="energy-page"><div class="energy-head"><div class="energy-head-copy"><h1>排行与结构</h1><div class="energy-head-note">（排行与结构使用同一统计时段；变化值均由对应比较期复算）</div></div></div>
<div class="energy-filter"><div class="fb">
  <div class="fi"><span class="fl">排行维度</span><select id="rankDimension"><option value="room">房间</option><option value="tenant">租户</option><option value="floor">楼层</option><option value="building">楼栋</option><option value="system">空调系统</option></select></div>
  <div class="fi"><span class="fl">指标</span><select id="rankMetric"><option value="energy">能耗</option><option value="runtime">运行时长</option></select></div>
  <div class="fi"><span class="fl">时段</span><select id="rankPeriod"><option value="month">本月</option><option value="day">本日</option><option value="year">本年</option><option value="custom">自定义</option></select></div>
  <div class="fi" id="rankCustomRange" style="display:none"><span class="fl">日期范围</span><input id="rankFrom" type="date"><span class="text-sub">至</span><input id="rankTo" type="date"></div>
  <div class="fi"><span class="fl">范围</span><select id="rankLimit"><option value="10">TOP10</option><option value="20">TOP20</option><option value="50">TOP50</option><option value="999">全部</option></select></div>
  <div class="fi"><span class="fl">排序</span><select id="rankOrder"><option value="desc">倒序</option><option value="asc">正序</option></select></div>
  <button class="btn btnp" id="queryRank">查询</button><button class="btn" id="exportRank">⬆ 导出</button>
</div></div>
<div class="energy-grid-2" style="grid-template-columns:minmax(0,3fr) minmax(360px,2fr)">
  <section class="energy-panel"><div class="energy-panel-head"><div><div class="energy-panel-title">能耗排行</div><div class="energy-panel-sub" id="rankSubtitle"></div></div></div><div class="energy-chart sm" id="rankChart"></div><div class="tw"><table><thead><tr><th>排名</th><th>对象</th><th>数值</th><th>占所选合计</th><th>同比</th><th>操作</th></tr></thead><tbody id="rankRows"></tbody></table></div></section>
  <section class="energy-panel"><div class="energy-panel-head"><div><div class="energy-panel-title">结构占比</div><div class="energy-panel-sub">与排行共用统计时段</div></div><div class="energy-segment"><button class="active" data-structure="zone">公区/租户区</button><button data-structure="building">楼栋</button><button data-structure="tenant">租户</button></div></div><div class="energy-chart sm" id="structureChart"></div><div class="tw"><table><thead><tr><th>分组</th><th>能耗(kWh)</th><th>占比</th><th>较上期变化</th></tr></thead><tbody id="structureRows"></tbody><tfoot><tr class="energy-total-row"><td>合计</td><td id="structureTotal" data-value="0">--</td><td>100%</td><td>--</td></tr></tfoot></table></div></section>
</div></div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_allocation.js"></script><script src="_energy-data.js"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script><script>
var energy=HvacEnergy,rankChart=null,structureChart=null,structureDimension='zone',rankData=null,structureData=null,dataWindow=energy.getDataWindow();
var params=new URLSearchParams(location.search);
function fmt(v,d){return energy.formatNumber(v,d);}function range(){var p=document.getElementById('rankPeriod').value,today=dataWindow.to;if(p==='custom')return {from:document.getElementById('rankFrom').value,to:document.getElementById('rankTo').value};return p==='day'?{from:today,to:today}:p==='year'?{from:today.slice(0,4)+'-01-01',to:today}:{from:today.slice(0,8)+'01',to:today};}
function rateCell(value,attribute,suffix){if(value==null)return '<td '+attribute+'="">--</td>';var className=value>0?'energy-up':value<0?'energy-down':'',arrow=value>0?'↑ ':value<0?'↓ ':'';return '<td class="'+className+'" '+attribute+'="'+value+'">'+arrow+Math.abs(value).toFixed(1)+suffix+'</td>';}
function render(){var r=range(),metric=document.getElementById('rankMetric').value;rankData=energy.getRanking({dimension:document.getElementById('rankDimension').value,metric:metric,from:r.from,to:r.to,limit:document.getElementById('rankLimit').value,order:document.getElementById('rankOrder').value});structureData=energy.getStructure({dimension:structureDimension,from:r.from,to:r.to});var unit=metric==='runtime'?'h':'kWh';document.getElementById('rankSubtitle').textContent=document.getElementById('rankDimension').selectedOptions[0].text+' · '+document.getElementById('rankPeriod').selectedOptions[0].text;document.getElementById('rankRows').innerHTML=rankData.rows.map(function(row,index){var value=row[metric];return '<tr><td>'+(index+1)+'</td><td>'+row.name+'</td><td data-value="'+value+'">'+fmt(value)+' '+unit+'</td><td>'+fmt(row.percent)+'%</td>'+rateCell(row.yoyRate,'data-yoy','%')+'<td><button class="energy-link" data-id="'+row.id+'">查看趋势</button></td></tr>';}).join('');document.querySelectorAll('#rankRows .energy-link').forEach(function(btn){btn.onclick=function(){parent.postMessage({nav:'energy-trend',q:'gran=day&from='+r.from+'&to='+r.to+'&obj='+encodeURIComponent(btn.dataset.id)+'&metric='+metric},'*');};});document.getElementById('structureRows').innerHTML=structureData.rows.map(function(row){return '<tr><td>'+row.name+'</td><td data-energy="'+row.energy+'">'+fmt(row.energy)+'</td><td>'+fmt(row.percent)+'%</td>'+rateCell(row.percentagePointChange,'data-point-change',' 个百分点')+'</tr>';}).join('');document.getElementById('structureTotal').dataset.value=structureData.total;document.getElementById('structureTotal').textContent=fmt(structureData.total);renderCharts(metric);}
function renderCharts(metric){if(!window.echarts){document.getElementById('rankChart').innerHTML='<div class="energy-chart-fallback">图表资源未加载，排行表仍可使用</div>';document.getElementById('structureChart').innerHTML='<div class="energy-chart-fallback">图表资源未加载，结构表仍可使用</div>';return;}rankChart=rankChart||echarts.init(document.getElementById('rankChart'));structureChart=structureChart||echarts.init(document.getElementById('structureChart'));var rows=rankData.rows.slice().reverse(),palette=['#409eff','#36cfc9','#e6a23c','#67c23a','#909399'];rankChart.setOption({grid:{left:90,right:30,top:10,bottom:25},tooltip:{trigger:'axis'},xAxis:{type:'value',axisLabel:{color:'#8492ad'},splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}}},yAxis:{type:'category',data:rows.map(function(r){return r.name;}),axisLabel:{color:'#aab5ca',width:80,overflow:'truncate'}},series:[{type:'bar',data:rows.map(function(r){return r[metric];}),barMaxWidth:14,itemStyle:{borderRadius:[0,4,4,0],color:'#409eff'}}]},true);structureChart.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{color:'#aab5ca'}},series:[{type:'pie',radius:['45%','68%'],center:['50%','43%'],label:{color:'#d8deeb',formatter:'{b}\n{d}%'},data:structureData.rows.map(function(row,index){var paletteIndex=index-Math.floor(index/palette.length)*palette.length;return {name:row.name,value:row.energy,itemStyle:{color:palette[paletteIndex]}};})}]},true);}
document.getElementById('rankFrom').value=dataWindow.to.slice(0,8)+'01';document.getElementById('rankTo').value=dataWindow.to;document.getElementById('rankFrom').min=document.getElementById('rankTo').min=dataWindow.from;document.getElementById('rankFrom').max=document.getElementById('rankTo').max=dataWindow.to;document.getElementById('rankPeriod').onchange=function(){document.getElementById('rankCustomRange').style.display=this.value==='custom'?'flex':'none';};document.getElementById('queryRank').onclick=render;document.getElementById('exportRank').onclick=function(){$msg('导出任务已生成，请稍候下载');};document.querySelectorAll('[data-structure]').forEach(function(btn){btn.onclick=function(){document.querySelectorAll('[data-structure]').forEach(function(item){item.classList.remove('active');});btn.classList.add('active');structureDimension=btn.dataset.structure;render();};});window.addEventListener('resize',function(){if(rankChart)rankChart.resize();if(structureChart)structureChart.resize();});if(params.get('dimension'))document.getElementById('rankDimension').value=params.get('dimension');if(params.get('period'))document.getElementById('rankPeriod').value=params.get('period');if(params.get('structure')){structureDimension=params.get('structure');document.querySelectorAll('[data-structure]').forEach(function(item){item.classList.toggle('active',item.dataset.structure===structureDimension);});}document.getElementById('rankPeriod').onchange();render();
</script></body></html>
