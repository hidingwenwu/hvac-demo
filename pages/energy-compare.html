<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>对比分析</title>
<link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css">
</head>
<body>
<div class="energy-page">
  <div class="energy-head"><div class="energy-head-copy"><h1>对比分析</h1></div></div>
  <div class="tabs"><div class="tab active" data-tab="time">时间对比</div><div class="tab" data-tab="object">对象对比</div></div>

  <section id="timeMode">
    <div class="energy-filter"><div class="fb">
      <div class="fi"><span class="fl">统计对象</span><span id="timeObjBox"></span></div>
      <div class="fi"><span class="fl">时间粒度</span><select id="timeGran" style="width:100px"></select></div>
      <div class="fi"><span class="fl">本期范围</span><span id="timeRangeBox"></span></div>
      <div class="fi"><span class="fl">对比方式</span><select id="compareWay" style="width:120px"><option value="mom">环比期</option><option value="yoy">同比期</option><option value="custom">自定义</option></select></div>
      <div class="fi" id="customBox" style="display:none"><span class="fl">对比起始</span><span id="customStartBox"></span><span class="text-sub" id="customEndNote"></span></div>
      <button class="btn btnp" id="queryTime">查询</button><button class="btn" id="exportTime">导出</button>
    </div></div>
    <div class="energy-summary" style="grid-template-columns:repeat(5,minmax(150px,1fr))">
      <div class="energy-summary-item"><div class="energy-summary-label">本期总量</div><div class="energy-summary-value" id="currentTotal" data-value="0">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">对比期总量</div><div class="energy-summary-value" id="comparisonTotal" data-value="0">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">差值</div><div class="energy-summary-value" id="differenceTotal">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">差值率</div><div class="energy-summary-value" id="differenceRate">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label" id="avgDiffLabel">日均差值</div><div class="energy-summary-value" id="averageDifference">--</div></div>
    </div>
    <section class="energy-panel" style="margin-bottom:14px"><div class="energy-panel-head"><div><div class="energy-panel-title">时间用能对比</div></div></div><div class="energy-chart lg" id="timeChart"></div></section>
    <div class="tw"><table><thead><tr><th>本期时间</th><th>本期能耗(kWh)</th><th>对比时间</th><th>对比期能耗(kWh)</th><th>差值</th><th>差值率</th></tr></thead><tbody id="compareRows"></tbody></table></div><div id="timePager"></div>
  </section>

  <section id="objectMode" style="display:none">
    <div class="energy-filter"><div class="fb">
      <div class="fi"><span class="fl">对象层级</span><select id="compareLevel" style="width:120px"><option value="room">房间</option><option value="tenant">租户</option><option value="building">楼栋</option><option value="floor">楼层</option><option value="group">群组</option><option value="meter">电表</option></select></div>
      <div class="fi"><span class="fl">可选对象</span><select id="availableObjects" multiple size="1" style="width:260px;height:32px"></select></div>
      <div class="fi"><span class="fl">时间粒度</span><select id="objectGran" style="width:100px"></select></div>
      <div class="fi"><span class="fl">时间范围</span><span id="objectRangeBox"></span></div>
      <div class="fi" style="flex:1"><span class="fl">已选</span><div id="selectedObjects" class="energy-selected"></div></div>
      <button class="btn btnp" id="queryObjects">查询</button><button class="btn" id="exportObjects">导出</button>
    </div></div>
    <section class="energy-panel" style="margin-bottom:14px"><div class="energy-panel-head"><div><div class="energy-panel-title">对象用能对比</div></div></div><div class="energy-chart lg" id="objectChart"></div></section>
    <div class="tw"><table id="objectTable"><thead id="objectHead"></thead><tbody id="objectRows"></tbody></table></div><div id="objectPager"></div>
  </section>
</div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_allocation.js"></script><script src="_energy-data.js"></script><script src="_energy-filter.js"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
var energy=HvacEnergy,timeChart=null,objectChart=null,selectedObjects=[],objectResults=[],dataWindow=energy.getDataWindow();
var timePg={total:0,page:1,size:10,sizes:[10,20,30,50],onChange:function(){renderTimeRows();}};
var objPg={total:0,page:1,size:24,sizes:[24,48,96],onChange:function(){renderObjectTable();}};
var timeObj='project',currentResult=null,comparisonResult=null;
function fmt(v,d){return energy.formatNumber(v,d==null?1:d);}
var RANGE_MODE={hour:'single',day:'date',month:'month',year:'year'};
var AVG_LABEL={hour:'小时均差值',day:'日均差值',month:'月均差值',year:'年均差值'};
var AVG_UNIT={hour:'kWh/时',day:'kWh/日',month:'kWh/月',year:'kWh/年'};
function pad(v){return String(v).padStart(2,'0');}
function parseD(s){return new Date(String(s).slice(0,10)+'T00:00:00');}
function fmtD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addD(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d);}
function monthStartOf(s){return String(s).slice(0,7)+'-01';}
function monthEndOf(s){var d=parseD(monthStartOf(s));return String(s).slice(0,7)+'-'+pad(new Date(d.getFullYear(),d.getMonth()+1,0).getDate());}
function shiftMonthStart(s,n){var d=parseD(monthStartOf(s));d.setMonth(d.getMonth()+n);return fmtD(d);}
function daysBetween(a,b){return Math.round((parseD(b)-parseD(a))/86400000)+1;}
function monthsBetween(a,b){var x=parseD(a),y=parseD(b);return (y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth()+1;}
function yearsBetween(a,b){return Number(String(b).slice(0,4))-Number(String(a).slice(0,4))+1;}

var timeRange=$erange('timeRangeBox',{mode:'date',from:dataWindow.to.slice(0,8)+'01',to:dataWindow.to,min:dataWindow.from,max:dataWindow.to});
var customStart=$erange('customStartBox',{mode:'date',pick:'start',from:dataWindow.to.slice(0,8)+'01',min:dataWindow.from,max:dataWindow.to,onChange:renderCustomEndNote});
var objectRange=$erange('objectRangeBox',{mode:'date',from:dataWindow.to.slice(0,8)+'01',to:dataWindow.to,min:dataWindow.from,max:dataWindow.to});
var timeObjSel=$eobj('timeObjBox',{types:['project','building','floor','room','tenant','group','meter'],onChange:function(id){timeObj=id;}});

function fillGranularities(){var html=energy.getGranularities().map(function(item){return '<option value="'+item.value+'">'+item.label+'</option>';}).join('');document.getElementById('timeGran').innerHTML=html;document.getElementById('objectGran').innerHTML=html;}

/* 自定义对比期：只选起始，按本期跨度自动等长推算结束 */
function customRange(gran){
  var start=customStart.getRange().from,base=timeRange.getRange(),span,end;
  if(gran==='month'){span=monthsBetween(base.from,base.to);end=monthEndOf(shiftMonthStart(start,span-1));}
  else if(gran==='year'){span=yearsBetween(base.from,base.to);end=(Number(start.slice(0,4))+span-1)+'-12-31';}
  else if(gran==='hour'){end=start;}
  else{span=daysBetween(base.from,base.to);end=addD(start,span-1);}
  if(end>dataWindow.to)end=dataWindow.to;
  return {from:start,to:end};
}
function renderCustomEndNote(){
  var gran=document.getElementById('timeGran').value,range=customRange(gran);
  document.getElementById('customEndNote').textContent='至 '+range.to+'（自动按本期跨度推算）';
}

function queryTime(){
  var gran=document.getElementById('timeGran').value,base=timeRange.getRange();
  var from=base.from,to=base.to;
  if(gran==='hour')to=from;
  var way=document.getElementById('compareWay').value;
  var crange=way==='custom'?customRange(gran):energy.comparisonRange({granularity:gran,from:from,to:to},way);
  currentResult=energy.queryTrend({obj:timeObj,granularity:gran,from:from,to:to});
  comparisonResult=energy.queryTrend({obj:timeObj,granularity:gran,from:crange.from,to:crange.to});
  var count=Math.min(currentResult.points.length,comparisonResult.points.length);
  var current=Number(currentResult.points.slice(0,count).reduce(function(sum,p){return sum+p.energy;},0).toFixed(2));
  var compare=Number(comparisonResult.points.slice(0,count).reduce(function(sum,p){return sum+p.energy;},0).toFixed(2));
  var diff=Number((current-compare).toFixed(2)),rate=energy.changeRate(current,compare);
  document.getElementById('currentTotal').dataset.value=current;
  document.getElementById('comparisonTotal').dataset.value=compare;
  document.getElementById('currentTotal').textContent=fmt(current)+' kWh';
  document.getElementById('comparisonTotal').textContent=fmt(compare)+' kWh';
  document.getElementById('differenceTotal').textContent=fmt(diff)+' kWh';
  var rateEl=document.getElementById('differenceRate');
  rateEl.textContent=rate==null?'--':(rate>0?'↑ ':rate<0?'↓ ':'')+Math.abs(rate).toFixed(1)+'%';
  rateEl.className='energy-summary-value '+(rate>0?'energy-up':rate<0?'energy-down':'');
  document.getElementById('avgDiffLabel').textContent=AVG_LABEL[gran]||'日均差值';
  document.getElementById('averageDifference').textContent=fmt(count?diff/count:null)+' kWh';
  timePg.page=1;timePg.total=count;$pager('timePager',timePg);renderTimeRows();renderTimeChart();
}
function renderTimeRows(){
  var start=(timePg.page-1)*timePg.size;
  document.getElementById('compareRows').innerHTML=currentResult.points.slice(start,Math.min(start+timePg.size,timePg.total)).map(function(point,index){
    var cp=comparisonResult.points[start+index]||{label:'--',energy:null};
    var diff=cp.energy==null?null:Number((point.energy-cp.energy).toFixed(2)),rate=energy.changeRate(point.energy,cp.energy);
    var cls=rate>0?'energy-up':rate<0?'energy-down':'';
    return '<tr><td>'+point.label+'</td><td>'+fmt(point.energy)+'</td><td>'+cp.label+'</td><td>'+(cp.energy==null?'--':fmt(cp.energy))+'</td><td>'+(diff==null?'--':fmt(diff))+'</td><td class="'+cls+'">'+(rate==null?'--':(rate>0?'↑ ':rate<0?'↓ ':'')+Math.abs(rate).toFixed(1)+'%')+'</td></tr>';
  }).join('')||'<tr><td colspan="6"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';
}
function renderTimeChart(){
  var el=document.getElementById('timeChart');
  if(!window.echarts){el.innerHTML='<div class="energy-chart-fallback">图表资源未加载，对比表仍可使用</div>';return;}
  timeChart=timeChart||echarts.init(el);
  timeChart.setOption({tooltip:{trigger:'axis'},legend:{top:0,textStyle:{color:'#aab5ca'}},grid:{left:55,right:25,top:38,bottom:35},xAxis:{type:'category',data:currentResult.points.slice(0,timePg.total).map(function(p){return p.label;}),axisLabel:{color:'#8492ad'}},yAxis:{type:'value',axisLabel:{color:'#8492ad'},splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}}},series:[{name:'本期',type:'bar',data:currentResult.points.slice(0,timePg.total).map(function(p){return p.energy;}),barMaxWidth:22,itemStyle:{color:'#409eff'}},{name:'对比期',type:'bar',data:comparisonResult.points.slice(0,timePg.total).map(function(p){return p.energy;}),barMaxWidth:22,itemStyle:{color:'#36cfc9'}}]},true);
}

/* ── 对象对比 ── */
function fillObjects(){var items=energy.getCatalog(document.getElementById('compareLevel').value);document.getElementById('availableObjects').innerHTML=items.map(function(item){return '<option value="'+item.id+'">'+item.name+'</option>';}).join('');selectedObjects=[];renderSelected();}
function renderSelected(){document.getElementById('selectedObjects').innerHTML=selectedObjects.length?selectedObjects.map(function(id){var item=energy.resolveObject(id);return '<span class="tag">'+item.name+' <button data-remove="'+id+'">×</button></span>';}).join(''):'<span class="text-sub">请选择 2 至 10 个对象</span>';document.querySelectorAll('[data-remove]').forEach(function(button){button.onclick=function(){selectedObjects=selectedObjects.filter(function(id){return id!==button.dataset.remove;});renderSelected();};});}
function pickObjects(){var values=Array.from(document.getElementById('availableObjects').selectedOptions).map(function(o){return o.value;});var merged=Array.from(new Set(selectedObjects.concat(values)));if(merged.length>10){$msg('最多对比 10 个对象','warning');merged=merged.slice(0,10);}selectedObjects=merged;renderSelected();}
function queryObjects(){
  if(selectedObjects.length<2){$msg('请至少选择 2 个对象','warning');return;}
  var gran=document.getElementById('objectGran').value,range=objectRange.getRange();
  var from=range.from,to=range.to;
  if(gran==='hour')to=from;
  objectResults=selectedObjects.map(function(id){return energy.queryTrend({obj:id,granularity:gran,from:from,to:to});});
  objPg.page=1;objPg.total=objectResults[0]?objectResults[0].points.length:0;$pager('objectPager',objPg);
  renderObjectTable();renderObjectChart();
}
function renderObjectTable(){
  var gran=document.getElementById('objectGran').value,head='<tr><th>统计项</th>'+objectResults.map(function(r){return '<th>'+r.object.name+'</th>';}).join('')+'</tr>';
  document.getElementById('objectHead').innerHTML=head;
  var summaryRows=[
    {label:'期间总能耗(kWh)',values:objectResults.map(function(r){return r.summary.total;})},
    {label:'期间平均('+AVG_UNIT[gran]+')',values:objectResults.map(function(r){return r.summary.average;})}
  ];
  var start=(objPg.page-1)*objPg.size,points=objectResults[0]?objectResults[0].points.slice(start,start+objPg.size):[];
  var html=summaryRows.map(function(row){return '<tr><td>'+row.label+'</td>'+row.values.map(function(v){return '<td>'+fmt(v)+'</td>';}).join('')+'</tr>';}).join('');
  html+=points.map(function(point,idx){return '<tr><td>'+point.label+'</td>'+objectResults.map(function(r){var p=r.points[start+idx];return '<td>'+(p?fmt(p.energy):'--')+'</td>';}).join('')+'</tr>';}).join('');
  document.getElementById('objectRows').innerHTML=html||'<tr><td colspan="'+(objectResults.length+1)+'"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';
}
function renderObjectChart(){
  var el=document.getElementById('objectChart');
  if(!window.echarts){el.innerHTML='<div class="energy-chart-fallback">图表资源未加载，对比表仍可使用</div>';return;}
  objectChart=objectChart||echarts.init(el);
  objectChart.setOption({tooltip:{trigger:'axis'},legend:{top:0,textStyle:{color:'#aab5ca'}},grid:{left:55,right:25,top:38,bottom:35},xAxis:{type:'category',data:objectResults[0]?objectResults[0].points.map(function(p){return p.label;}):[],axisLabel:{color:'#8492ad'}},yAxis:{type:'value',axisLabel:{color:'#8492ad'},splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}}},series:objectResults.map(function(result,index){return {name:result.object.name,type:'line',smooth:true,showSymbol:false,data:result.points.map(function(p){return p.energy;}),lineStyle:{color:['#409eff','#36cfc9','#e6a23c','#67c23a','#f56c6c','#909399','#9fd4ff','#b37feb','#5cdbd3','#eebe77'][index]}};})},true);
}

document.querySelectorAll('.tabs .tab').forEach(function(tab){tab.onclick=function(){document.querySelectorAll('.tabs .tab').forEach(function(item){item.classList.remove('active');});tab.classList.add('active');document.getElementById('timeMode').style.display=tab.dataset.tab==='time'?'block':'none';document.getElementById('objectMode').style.display=tab.dataset.tab==='object'?'block':'none';if(tab.dataset.tab==='object')fillObjects();};});
document.getElementById('timeGran').onchange=function(){var mode=RANGE_MODE[this.value]||'date';timeRange.setMode(mode);customStart.setMode(mode);if(this.value==='hour'){var r=timeRange.getRange();timeRange.setRange(r.to,r.to);customStart.setRange(r.to,r.to);}renderCustomEndNote();};
document.getElementById('objectGran').onchange=function(){var mode=RANGE_MODE[this.value]||'date';objectRange.setMode(mode);if(this.value==='hour'){var r=objectRange.getRange();objectRange.setRange(r.to,r.to);}};
document.getElementById('compareWay').onchange=function(){document.getElementById('customBox').style.display=this.value==='custom'?'flex':'none';if(this.value==='custom')renderCustomEndNote();};
document.getElementById('queryTime').onclick=queryTime;
document.getElementById('queryObjects').onclick=queryObjects;
document.getElementById('exportTime').onclick=function(){$msg('导出任务已生成，请稍候下载');};
document.getElementById('exportObjects').onclick=function(){$msg('导出任务已生成，请稍候下载');};
document.getElementById('compareLevel').onchange=fillObjects;
document.getElementById('availableObjects').onchange=pickObjects;
window.addEventListener('resize',function(){if(timeChart)timeChart.resize();if(objectChart)objectChart.resize();});
fillGranularities();queryTime();
</script>
</body>
</html>
