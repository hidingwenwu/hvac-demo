<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>对比分析</title>
<link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css">
</head>
<body>
<div class="energy-page">
  <div class="energy-head"><h1>对比分析</h1><div class="energy-head-meta">同一对象两期对比 · 同一时段对象对比</div></div>
  <div class="tabs"><div class="tab active" data-tab="time">时间对比</div><div class="tab" data-tab="object">对象对比</div></div>
  <section id="timeMode">
    <div class="energy-filter"><div class="fb">
      <div class="fi"><span class="fl">统计对象</span><select id="timeObject" style="width:220px"></select></div>
      <div class="fi"><span class="fl">时间粒度</span><select id="timeGran" style="width:100px"><option value="day">按日</option><option value="week">按周</option><option value="month">按月</option></select></div>
      <div class="fi"><span class="fl">本期范围</span><input id="timeFrom" type="date" value="2026-08-01" style="width:145px"><span class="text-sub">至</span><input id="timeTo" type="date" value="2026-08-13" style="width:145px"></div>
      <div class="fi"><span class="fl">对比方式</span><select id="compareWay" style="width:120px"><option value="mom">环比期</option><option value="yoy">同比期</option><option value="custom">自定义两期</option></select></div>
      <div class="fi" id="customRange" style="display:none"><span class="fl">对比范围</span><input id="customFrom" type="date" value="2026-07-19" style="width:145px"><span class="text-sub">至</span><input id="customTo" type="date" value="2026-07-31" style="width:145px"></div>
      <button class="btn btnp" id="queryTime">查询</button>
    </div></div>
    <div class="energy-summary" style="grid-template-columns:repeat(5,minmax(150px,1fr))">
      <div class="energy-summary-item"><div class="energy-summary-label">本期总量</div><div class="energy-summary-value" id="currentTotal" data-value="0">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">对比期总量</div><div class="energy-summary-value" id="comparisonTotal" data-value="0">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">差值</div><div class="energy-summary-value" id="differenceTotal">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">差值率</div><div class="energy-summary-value energy-up" id="differenceRate">--</div></div>
      <div class="energy-summary-item"><div class="energy-summary-label">日均差值</div><div class="energy-summary-value" id="averageDifference">--</div></div>
    </div>
    <div class="energy-note" id="alignmentNote" style="display:none"></div>
    <section class="energy-panel" style="margin-bottom:14px"><div class="energy-panel-head"><div><div class="energy-panel-title">两期能耗对比</div><div class="energy-panel-sub" id="timeSubtitle"></div></div></div><div class="energy-chart lg" id="timeChart"></div></section>
    <div class="tw"><table><thead><tr><th>点位</th><th>本期</th><th>对比期</th><th>差值</th><th>差值率</th></tr></thead><tbody id="compareRows"></tbody></table></div><div id="timePager"></div>
  </section>
  <section id="objectMode" style="display:none">
    <div class="energy-filter"><div class="fb">
      <div class="fi"><span class="fl">对象层级</span><select id="compareLevel" style="width:120px"><option value="room">房间</option><option value="tenant">租户</option><option value="building">楼栋</option><option value="floor">楼层</option><option value="system">空调系统</option><option value="group">群组</option><option value="meter">电表</option></select></div>
      <div class="fi"><span class="fl">可选对象</span><select id="availableObjects" multiple size="1" style="width:260px;height:32px"></select></div>
      <div class="fi"><span class="fl">时间粒度</span><select id="objectGran" style="width:90px"><option value="day">按日</option><option value="week">按周</option><option value="month">按月</option></select></div>
      <div class="fi"><span class="fl">时间范围</span><input id="objectFrom" type="date" value="2026-08-01"><span class="text-sub">至</span><input id="objectTo" type="date" value="2026-08-13"></div>
      <div class="fi" style="flex:1"><span class="fl">已选</span><div id="selectedObjects" class="energy-selected"></div></div>
      <button class="btn btnp" id="queryObjects">查询</button>
    </div></div>
    <section class="energy-panel" style="margin-bottom:14px"><div class="energy-panel-head"><div><div class="energy-panel-title">对象用能对比</div><div class="energy-panel-sub">同一统计时段内多对象横向对标</div></div></div><div class="energy-chart lg" id="objectChart"></div></section>
    <div class="tw"><table><thead><tr><th>对象</th><th>总能耗</th><th>日均</th><th>最大单日</th><th>占所选合计</th><th>运行时长</th><th>单位时长能耗</th></tr></thead><tbody id="objectRows"></tbody></table></div>
  </section>
</div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_energy-data.js"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
var energy=HvacEnergy,timeChart=null,objectChart=null,selectedObjects=[],objectResults=[],objectChartOption=null,alignedTimeCount=0;
var timePg={total:0,page:1,size:10,sizes:[10,20,30],onChange:function(){renderTimeRows();}};
var currentResult=null,comparisonResult=null;
function fmt(value,digits){return energy.formatNumber(value,digits);}
function dateShift(text,days){var date=new Date(text+'T00:00:00');date.setDate(date.getDate()+days);return date.toISOString().slice(0,10);}
function fillTimeObjects(){var items=energy.getCatalog('building').concat(energy.getCatalog('floor'),energy.getCatalog('room'),energy.getCatalog('tenant'),energy.getCatalog('system'),energy.getCatalog('group'));document.getElementById('timeObject').innerHTML='<option value="project">项目整体</option>'+items.map(function(item){return '<option value="'+item.id+'">'+item.name+'</option>';}).join('');}
function comparisonRange(from,to,way){var days=Math.round((new Date(to)-new Date(from))/86400000)+1;if(way==='custom')return {from:document.getElementById('customFrom').value,to:document.getElementById('customTo').value};if(way==='yoy')return {from:String(Number(from.slice(0,4))-1)+from.slice(4),to:String(Number(to.slice(0,4))-1)+to.slice(4)};return {from:dateShift(from,-days),to:dateShift(to,-days)};}
function renderTime(){var from=document.getElementById('timeFrom').value,to=document.getElementById('timeTo').value,gran=document.getElementById('timeGran').value,range=comparisonRange(from,to,document.getElementById('compareWay').value);currentResult=energy.queryTrend({obj:document.getElementById('timeObject').value,granularity:gran,from:from,to:to});comparisonResult=energy.queryTrend({obj:document.getElementById('timeObject').value,granularity:gran,from:range.from,to:range.to});alignedTimeCount=Math.min(currentResult.points.length,comparisonResult.points.length);var extraCount=Math.abs(currentResult.points.length-comparisonResult.points.length),alignmentNote=document.getElementById('alignmentNote');alignmentNote.style.display=extraCount?'block':'none';alignmentNote.textContent=extraCount?'两期长度不同，已按较短区间的 '+alignedTimeCount+' 个点位对齐，较长区间多余 '+extraCount+' 个点位未参与比较。':'';var current=Number(currentResult.points.slice(0,alignedTimeCount).reduce(function(sum,point){return sum+point.energy;},0).toFixed(2)),compare=Number(comparisonResult.points.slice(0,alignedTimeCount).reduce(function(sum,point){return sum+point.energy;},0).toFixed(2)),difference=current-compare;document.getElementById('currentTotal').dataset.value=current;document.getElementById('comparisonTotal').dataset.value=compare;document.getElementById('currentTotal').textContent=fmt(current)+' kWh';document.getElementById('comparisonTotal').textContent=fmt(compare)+' kWh';document.getElementById('differenceTotal').textContent=fmt(difference)+' kWh';document.getElementById('differenceRate').textContent=(compare?(difference*100/compare).toFixed(1):'--')+'%';document.getElementById('averageDifference').textContent=fmt(difference/Math.max(1,alignedTimeCount))+' kWh';document.getElementById('timeSubtitle').textContent=from+' 至 '+to+' 对比 '+range.from+' 至 '+range.to;timePg.page=1;timePg.total=alignedTimeCount;$pager('timePager',timePg);renderTimeRows();renderTimeChart();}
function renderTimeRows(){var start=(timePg.page-1)*timePg.size;document.getElementById('compareRows').innerHTML=currentResult.points.slice(start,Math.min(start+timePg.size,alignedTimeCount)).map(function(point,index){var compare=comparisonResult.points[start+index],difference=point.energy-compare.energy;return '<tr><td>'+point.label+'</td><td>'+fmt(point.energy)+'</td><td>'+fmt(compare.energy)+'</td><td>'+fmt(difference)+'</td><td class="'+(difference>0?'energy-up':'energy-down')+'">'+(compare.energy?(difference*100/compare.energy).toFixed(1):'--')+'%</td></tr>';}).join('');}
function renderTimeChart(){var el=document.getElementById('timeChart');if(!window.echarts){el.innerHTML='<div class="energy-chart-fallback">图表资源未加载，对比表仍可使用</div>';return;}timeChart=timeChart||echarts.init(el);timeChart.setOption({tooltip:{trigger:'axis'},legend:{top:0,textStyle:{color:'#aab5ca'}},grid:{left:55,right:25,top:38,bottom:35},xAxis:{type:'category',data:currentResult.points.slice(0,alignedTimeCount).map(function(point){return point.label;}),axisLabel:{color:'#8492ad'}},yAxis:{type:'value',axisLabel:{color:'#8492ad'},splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}}},series:[{name:'本期',type:'bar',data:currentResult.points.slice(0,alignedTimeCount).map(function(point){return point.energy;})},{name:'对比期',type:'bar',data:comparisonResult.points.slice(0,alignedTimeCount).map(function(point){return point.energy;})}]},true);}
function fillObjects(){var items=energy.getCatalog(document.getElementById('compareLevel').value);document.getElementById('availableObjects').innerHTML=items.map(function(item){return '<option value="'+item.id+'">'+item.name+'</option>';}).join('');selectedObjects=[];renderSelected();}
function renderSelected(){document.getElementById('selectedObjects').innerHTML=selectedObjects.length?selectedObjects.map(function(id){var item=energy.resolveObject(id);return '<span class="tag">'+item.name+' <button data-remove="'+id+'">×</button></span>';}).join(''):'<span class="text-sub">请选择 2 至 6 个对象</span>';document.querySelectorAll('[data-remove]').forEach(function(button){button.onclick=function(){selectedObjects=selectedObjects.filter(function(id){return id!==button.dataset.remove;});renderSelected();};});}
function pickObjects(){var values=Array.from(document.getElementById('availableObjects').selectedOptions).map(function(option){return option.value;});var merged=Array.from(new Set(selectedObjects.concat(values)));if(merged.length>6){$msg('最多对比 6 个对象','warning');merged=merged.slice(0,6);}selectedObjects=merged;renderSelected();}
function renderObjects(){if(selectedObjects.length<2){$msg('请至少选择 2 个对象','warning');return;}var gran=document.getElementById('objectGran').value,from=document.getElementById('objectFrom').value,to=document.getElementById('objectTo').value;objectResults=selectedObjects.map(function(id){return energy.queryTrend({obj:id,granularity:gran,from:from,to:to});});var rows=objectResults.map(function(trend){return {name:trend.object.name,energy:trend.summary.total,average:trend.summary.average,max:trend.summary.max,runtime:trend.summary.runtime};});var total=rows.reduce(function(sum,row){return sum+row.energy;},0);document.getElementById('objectRows').innerHTML=rows.map(function(row){return '<tr><td>'+row.name+'</td><td>'+fmt(row.energy)+'</td><td>'+fmt(row.average)+'</td><td>'+fmt(row.max)+'</td><td>'+fmt(row.energy*100/total)+'%</td><td>'+fmt(row.runtime)+'</td><td>'+fmt(row.energy/Math.max(.01,row.runtime))+'</td></tr>';}).join('');renderObjectChart();}
function renderObjectChart(){var el=document.getElementById('objectChart');objectChartOption={tooltip:{trigger:'axis'},legend:{top:0,textStyle:{color:'#aab5ca'}},xAxis:{type:'category',data:objectResults[0].points.map(function(point){return point.label;}),axisLabel:{color:'#8492ad'}},yAxis:{type:'value',axisLabel:{color:'#8492ad'}},series:objectResults.map(function(result,index){return {name:result.object.name,type:'line',smooth:true,data:result.points.map(function(point){return point.energy;}),lineStyle:{color:['#409eff','#36cfc9','#e6a23c','#67c23a','#f56c6c','#909399'][index]}};})};if(!window.echarts){el.innerHTML='<div class="energy-chart-fallback">图表资源未加载，对比表仍可使用</div>';return;}objectChart=objectChart||echarts.init(el);objectChart.setOption(objectChartOption,true);}
document.querySelectorAll('.tabs .tab').forEach(function(tab){tab.onclick=function(){document.querySelectorAll('.tabs .tab').forEach(function(item){item.classList.remove('active');});tab.classList.add('active');document.getElementById('timeMode').style.display=tab.dataset.tab==='time'?'block':'none';document.getElementById('objectMode').style.display=tab.dataset.tab==='object'?'block':'none';if(tab.dataset.tab==='object')fillObjects();};});
document.getElementById('queryTime').onclick=renderTime;document.getElementById('queryObjects').onclick=renderObjects;document.getElementById('compareLevel').onchange=fillObjects;document.getElementById('availableObjects').onchange=pickObjects;window.addEventListener('resize',function(){if(timeChart)timeChart.resize();if(objectChart)objectChart.resize();});fillTimeObjects();renderTime();
document.getElementById('compareWay').onchange=function(){document.getElementById('customRange').style.display=this.value==='custom'?'flex':'none';};
</script>
</body></html>
