<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群组管理</title><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css"></head>
<body>
<div class="energy-page">
  <div class="energy-head"><div class="energy-head-copy"><h1>群组管理</h1></div><div class="pa"><button class="btn btnp" id="addGroup">＋ 新增群组</button></div></div>
  <div class="energy-note">说明：群组仅用于能耗统计；房间群组与电表群组不可混合；同一房间或电表可加入多个能耗分析群组。群组仅定义统计口径，不影响设备控制和历史能耗数据。</div>
  <div class="energy-filter"><div class="fb">
    <div class="fi"><span class="fl">群组名称</span><input id="filterName" placeholder="关键字" style="width:160px"></div>
    <div class="fi"><span class="fl">群组类型</span><select id="filterType"><option value="">全部</option><option value="room">房间群组</option><option value="meter">电表群组</option></select></div>
    <button class="btn btnp" id="filterQuery">查询</button><button class="btn" id="filterReset">重置</button>
  </div></div>
  <div class="tw"><table><thead><tr><th>群组名称</th><th style="width:92px">群组类型</th><th style="width:88px">成员数量</th><th>成员名称</th><th>备注</th><th style="width:138px">创建时间</th><th style="width:130px">操作</th></tr></thead><tbody id="groupRows"></tbody></table></div>
</div>
<div class="modal" id="groupDialog"><div class="dialog" style="width:780px"><div class="dh"><span id="dialogTitle">新增群组</span><span class="dx" onclick="$modalClose('groupDialog')">✕</span></div><div class="db">
  <div class="form-row mb14"><span class="fl"><span class="req">*</span>群组名称</span><input id="groupName" class="flex1" maxlength="20" placeholder="请输入群组名称"></div>
  <div class="form-row mb14"><span class="fl"><span class="req">*</span>群组类型</span><select id="groupType" class="flex1"><option value="room">房间群组</option><option value="meter">电表群组</option></select></div>
  <div class="form-row mb14"><span class="fl">备注</span><input id="groupRemark" class="flex1" maxlength="50" placeholder="请输入备注，最多 50 字"></div>
  <div class="form-row mb14" style="align-items:flex-start"><span class="fl"><span class="req">*</span><span id="memberLabel">成员房间</span></span><div class="flex1"><input id="memberSearch" placeholder="搜索楼栋、楼层或房间" style="width:100%;margin-bottom:8px"><div id="memberTree" class="energy-group-tree"></div><div class="energy-table-note" id="selectedCount">已选择 0 个房间</div></div></div>
</div><div class="df"><button class="btn" onclick="$modalClose('groupDialog')">取消</button><button class="btn btnp" id="saveGroup">保存</button></div></div></div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_energy-data.js"></script>
<script>
var energy=HvacEnergy,editingId=null,selectedMembers=new Set(),filterState={name:'',type:''};
function escapeHtml(text){return String(text).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});}
function selectedType(){return document.getElementById('groupType').value;}
function availableMembers(type){return energy.getCatalog(type||selectedType());}
function memberText(member,type){if(type==='meter')return member.name;return member.bld+' / '+member.fl+' / '+member.room;}
function groupView(group){var catalog=availableMembers(group.type),valid=group.memberIds.map(function(id){return catalog.find(function(member){return member.id===id;});}).filter(Boolean),names=valid.map(function(member){return memberText(member,group.type);});return {valid:valid.length,invalid:group.memberIds.length-valid.length,names:names};}
function compactNames(names){if(!names.length)return '--';var shown=names.slice(0,3).join('、');return shown+(names.length>3?' 等 '+names.length+' 个':'');}
function renderRows(){var groups=energy.listGroups().filter(function(group){return (!filterState.type||group.type===filterState.type)&&(!filterState.name||group.name.toLowerCase().indexOf(filterState.name)>=0);});document.getElementById('groupRows').innerHTML=groups.map(function(group){var view=groupView(group),typeName=group.type==='meter'?'电表群组':'房间群组';return '<tr><td>'+escapeHtml(group.name)+(view.invalid?'<span class="energy-badge warning" style="margin-left:6px;cursor:pointer" title="点击清理失效成员" data-clean="'+group.id+'">'+view.invalid+' 个成员失效</span>':'')+'</td><td><span class="energy-badge '+(group.type==='meter'?'meter':'')+'">'+typeName+'</span></td><td>'+view.valid+'</td><td class="energy-member-summary" title="'+escapeHtml(view.names.join('、'))+'">'+escapeHtml(compactNames(view.names))+'</td><td>'+escapeHtml(group.remark||'--')+'</td><td>'+group.createdAt+'</td><td><span class="op"><button class="energy-link" data-edit="'+group.id+'">编辑</button><button class="energy-link energy-up" data-delete="'+group.id+'">删除</button></span></td></tr>';}).join('')||'<tr><td colspan="7"><div class="empty"><span class="ei">📄</span><span class="et">暂无群组</span></div></td></tr>';document.querySelectorAll('[data-edit]').forEach(function(button){button.onclick=function(){openDialog(button.dataset.edit);};});document.querySelectorAll('[data-delete]').forEach(function(button){button.onclick=function(){$confirm('确定删除该分析群组吗？删除后仅移除分析视角，不影响历史能耗数据。',function(){energy.deleteGroup(button.dataset.delete);renderRows();$msg('删除成功');});};});document.querySelectorAll('[data-clean]').forEach(function(el){el.onclick=function(){var group=energy.listGroups().find(function(item){return item.id===el.dataset.clean;});if(!group)return;var catalog=availableMembers(group.type),validIds=group.memberIds.filter(function(id){return catalog.some(function(member){return member.id===id;});});$confirm('将移除 '+(group.memberIds.length-validIds.length)+' 个失效成员，是否继续？',function(){energy.saveGroup({id:group.id,type:group.type,name:group.name,remark:group.remark,memberIds:validIds});renderRows();$msg('已清理失效成员');});};});}
function roomTreeData(){var buildings={};availableMembers('room').forEach(function(room){if(!buildings[room.bld])buildings[room.bld]={};if(!buildings[room.bld][room.fl])buildings[room.bld][room.fl]=[];buildings[room.bld][room.fl].push(room);});return buildings;}
function checkState(ids){var count=ids.filter(function(id){return selectedMembers.has(id);}).length;return {checked:count===ids.length&&ids.length>0,indeterminate:count>0&&count<ids.length};}
function renderRoomTree(keyword){var data=roomTreeData(),html='';Object.keys(data).forEach(function(building){var buildingRooms=[];Object.keys(data[building]).forEach(function(floor){buildingRooms=buildingRooms.concat(data[building][floor]);});var buildingMatched=building.toLowerCase().includes(keyword),visibleBuilding=buildingMatched||buildingRooms.some(function(room){return room.fl.toLowerCase().includes(keyword)||room.room.toLowerCase().includes(keyword);});if(keyword&&!visibleBuilding)return;var buildingState=checkState(buildingRooms.map(function(room){return room.id;}));html+='<div class="energy-tree-group"><label class="energy-tree-row"><input type="checkbox" data-building="'+escapeHtml(building)+'" '+(buildingState.checked?'checked':'')+'><strong>'+escapeHtml(building)+'</strong></label><div class="energy-tree-children">';Object.keys(data[building]).forEach(function(floor){var rooms=data[building][floor],floorMatched=buildingMatched||floor.toLowerCase().includes(keyword),visibleRooms=rooms.filter(function(room){return !keyword||floorMatched||room.room.toLowerCase().includes(keyword);});if(!visibleRooms.length)return;var floorState=checkState(rooms.map(function(room){return room.id;}));html+='<div class="energy-tree-group"><label class="energy-tree-row"><input type="checkbox" data-floor="'+escapeHtml(building+'|'+floor)+'" '+(floorState.checked?'checked':'')+'><span>'+escapeHtml(floor)+'</span></label><div class="energy-tree-children">';visibleRooms.forEach(function(room){html+='<label class="energy-tree-row"><input type="checkbox" data-member="'+escapeHtml(room.id)+'" '+(selectedMembers.has(room.id)?'checked':'')+'><span>'+escapeHtml(room.room)+'</span></label>';});html+='</div></div>';});html+='</div></div>';});return html;}
function renderMeterList(keyword){var meters=availableMembers('meter').filter(function(meter){return !keyword||meter.name.toLowerCase().includes(keyword)||String(meter.rawId||'').toLowerCase().includes(keyword);});return '<div class="energy-meter-list">'+meters.map(function(meter){return '<label class="energy-meter-row"><input type="checkbox" data-member="'+escapeHtml(meter.id)+'" '+(selectedMembers.has(meter.id)?'checked':'')+'><span class="energy-meter-name">'+escapeHtml(meter.name)+'</span><span class="energy-meter-code">'+escapeHtml(meter.rawId||meter.id)+'</span></label>';}).join('')+'</div>';}
function idsForBuilding(name){return availableMembers('room').filter(function(room){return room.bld===name;}).map(function(room){return room.id;});}
function idsForFloor(key){var parts=key.split('|');return availableMembers('room').filter(function(room){return room.bld===parts[0]&&room.fl===parts[1];}).map(function(room){return room.id;});}
function setMany(ids,enabled){ids.forEach(function(id){if(enabled)selectedMembers.add(id);else selectedMembers.delete(id);});renderMembers();}
function bindMembers(){document.querySelectorAll('[data-member]').forEach(function(input){input.onchange=function(){if(input.checked)selectedMembers.add(input.dataset.member);else selectedMembers.delete(input.dataset.member);renderMembers();};});document.querySelectorAll('[data-building]').forEach(function(input){input.onchange=function(){setMany(idsForBuilding(input.dataset.building),input.checked);};});document.querySelectorAll('[data-floor]').forEach(function(input){input.onchange=function(){setMany(idsForFloor(input.dataset.floor),input.checked);};});}
function updateIndeterminate(){document.querySelectorAll('[data-building]').forEach(function(input){input.indeterminate=checkState(idsForBuilding(input.dataset.building)).indeterminate;});document.querySelectorAll('[data-floor]').forEach(function(input){input.indeterminate=checkState(idsForFloor(input.dataset.floor)).indeterminate;});}
function renderMembers(){var type=selectedType(),keyword=document.getElementById('memberSearch').value.trim().toLowerCase(),unit=type==='meter'?'电表':'房间';document.getElementById('memberLabel').textContent='成员'+unit;document.getElementById('memberSearch').placeholder=type==='meter'?'搜索电表名称或标识':'搜索楼栋、楼层或房间';var html=type==='meter'?renderMeterList(keyword):renderRoomTree(keyword);document.getElementById('memberTree').innerHTML=html||'<div class="empty" style="padding:30px"><span class="et">未找到匹配'+unit+'</span></div>';bindMembers();if(type==='room')updateIndeterminate();document.getElementById('selectedCount').textContent='已选择 '+selectedMembers.size+' 个'+unit;}
function applyType(type){var select=document.getElementById('groupType');select.value=type;select.dataset.previous=type;document.getElementById('memberSearch').value='';renderMembers();}
function requestTypeChange(nextType){var select=document.getElementById('groupType'),previousType=select.dataset.previous||'room';if(nextType===previousType)return;if(!selectedMembers.size){applyType(nextType);return;}select.value=previousType;$confirm('切换群组类型将清空已选择的成员，是否继续？',function(){selectedMembers.clear();applyType(nextType);});}
function openDialog(id){editingId=id||null;var group=id?energy.listGroups().find(function(item){return item.id===id;}):null;document.getElementById('dialogTitle').textContent=group?'编辑群组':'新增群组';document.getElementById('groupName').value=group?group.name:'';document.getElementById('groupRemark').value=group?group.remark:'';selectedMembers=new Set(group?group.memberIds:[]);applyType(group?group.type:'room');$modal('groupDialog');}
document.getElementById('addGroup').onclick=function(){openDialog();};
document.getElementById('filterQuery').onclick=function(){filterState={name:document.getElementById('filterName').value.trim().toLowerCase(),type:document.getElementById('filterType').value};renderRows();};
document.getElementById('filterReset').onclick=function(){document.getElementById('filterName').value='';document.getElementById('filterType').value='';filterState={name:'',type:''};renderRows();};
document.getElementById('memberSearch').oninput=renderMembers;
document.getElementById('groupType').onchange=function(){requestTypeChange(this.value);};
document.getElementById('saveGroup').onclick=function(){try{var wasEditing=!!editingId;energy.saveGroup({id:editingId,type:selectedType(),name:document.getElementById('groupName').value,remark:document.getElementById('groupRemark').value,memberIds:Array.from(selectedMembers)});$modalClose('groupDialog');renderRows();$msg(wasEditing?'修改成功':'新增成功');}catch(error){$msg(error.message,'error');}};
renderRows();
</script></body></html>
