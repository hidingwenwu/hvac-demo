<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群组管理</title><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css"></head>
<body>
<div class="energy-page">
  <div class="energy-head"><h1>群组管理</h1><div class="pa"><button class="btn btnp" id="addGroup">＋ 新增群组</button></div></div>
  <div class="energy-note">群组仅用于能耗分析，与集中控制的控制群组相互独立。同一房间可以加入多个分析群组。</div>
  <div class="tw"><table><thead><tr><th>群组名称</th><th>成员房间数</th><th>覆盖楼栋</th><th>备注</th><th>创建时间</th><th style="width:130px">操作</th></tr></thead><tbody id="groupRows"></tbody></table></div>
</div>
<div class="modal" id="groupDialog"><div class="dialog" style="width:720px"><div class="dh"><span id="dialogTitle">新增群组</span><span class="dx" onclick="$modalClose('groupDialog')">✕</span></div><div class="db">
  <div class="form-row mb14"><span class="fl"><span class="req">*</span>群组名称</span><input id="groupName" class="flex1" maxlength="20" placeholder="请输入群组名称"></div>
  <div class="form-row mb14"><span class="fl">备注</span><input id="groupRemark" class="flex1" maxlength="50" placeholder="请输入备注，最多 50 字"></div>
  <div class="form-row mb14" style="align-items:flex-start"><span class="fl"><span class="req">*</span>成员房间</span><div class="flex1"><input id="roomSearch" placeholder="搜索楼栋、楼层或房间" style="width:100%;margin-bottom:8px"><div id="roomTree" class="energy-group-tree"></div><div class="energy-table-note" id="selectedCount">已选择 0 个房间</div></div></div>
</div><div class="df"><button class="btn" onclick="$modalClose('groupDialog')">取消</button><button class="btn btnp" id="saveGroup">保存</button></div></div></div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_energy-data.js"></script>
<script>
var energy=HvacEnergy,editingId=null,selectedRooms=new Set(),allRooms=energy.getCatalog('room');
function escapeHtml(text){return String(text).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});}
function groupView(group){var rooms=group.roomIds.map(function(id){return allRooms.find(function(room){return room.id===id;});}).filter(Boolean),buildings=Array.from(new Set(rooms.map(function(room){return room.bld;})));return {valid:rooms.length,buildings:buildings.join('、')||'--',invalid:group.roomIds.length-rooms.length};}
function renderRows(){var groups=energy.listGroups();document.getElementById('groupRows').innerHTML=groups.map(function(group){var view=groupView(group);return '<tr><td>'+escapeHtml(group.name)+(view.invalid?'<span class="energy-badge warning" style="margin-left:6px">'+view.invalid+' 个成员失效</span>':'')+'</td><td>'+view.valid+'</td><td>'+escapeHtml(view.buildings)+'</td><td>'+escapeHtml(group.remark||'--')+'</td><td>'+group.createdAt+'</td><td><span class="op"><button class="energy-link" data-edit="'+group.id+'">编辑</button><button class="energy-link energy-up" data-delete="'+group.id+'">删除</button></span></td></tr>';}).join('')||'<tr><td colspan="6"><div class="empty"><span class="ei">📄</span><span class="et">暂无群组</span></div></td></tr>';document.querySelectorAll('[data-edit]').forEach(function(button){button.onclick=function(){openDialog(button.dataset.edit);};});document.querySelectorAll('[data-delete]').forEach(function(button){button.onclick=function(){$confirm('确定删除该分析群组吗？删除后仅移除分析视角，不影响历史能耗数据。',function(){energy.deleteGroup(button.dataset.delete);renderRows();$msg('删除成功');});};});}
function treeData(){var buildings={};allRooms.forEach(function(room){if(!buildings[room.bld])buildings[room.bld]={};if(!buildings[room.bld][room.fl])buildings[room.bld][room.fl]=[];buildings[room.bld][room.fl].push(room);});return buildings;}
function checkState(ids){var count=ids.filter(function(id){return selectedRooms.has(id);}).length;return {checked:count===ids.length&&ids.length>0,indeterminate:count>0&&count<ids.length};}
function renderTree(){var keyword=document.getElementById('roomSearch').value.trim().toLowerCase(),data=treeData(),html='';Object.keys(data).forEach(function(building){var buildingRooms=[];Object.keys(data[building]).forEach(function(floor){buildingRooms=buildingRooms.concat(data[building][floor]);});var visibleBuilding=building.toLowerCase().includes(keyword)||buildingRooms.some(function(room){return room.fl.toLowerCase().includes(keyword)||room.room.toLowerCase().includes(keyword);});if(keyword&&!visibleBuilding)return;var bState=checkState(buildingRooms.map(function(room){return room.id;}));html+='<div class="energy-tree-group"><label class="energy-tree-row"><input type="checkbox" data-building="'+escapeHtml(building)+'" '+(bState.checked?'checked':'')+'><strong>'+escapeHtml(building)+'</strong></label><div class="energy-tree-children">';Object.keys(data[building]).forEach(function(floor){var rooms=data[building][floor],visibleRooms=rooms.filter(function(room){return !keyword||building.toLowerCase().includes(keyword)||floor.toLowerCase().includes(keyword)||room.room.toLowerCase().includes(keyword);});if(!visibleRooms.length)return;var fState=checkState(rooms.map(function(room){return room.id;}));html+='<div class="energy-tree-group"><label class="energy-tree-row"><input type="checkbox" data-floor="'+escapeHtml(building+'|'+floor)+'" '+(fState.checked?'checked':'')+'><span>'+escapeHtml(floor)+'</span></label><div class="energy-tree-children">';visibleRooms.forEach(function(room){html+='<label class="energy-tree-row"><input type="checkbox" data-room="'+escapeHtml(room.id)+'" '+(selectedRooms.has(room.id)?'checked':'')+'><span>'+escapeHtml(room.room)+'</span></label>';});html+='</div></div>';});html+='</div></div>';});document.getElementById('roomTree').innerHTML=html||'<div class="empty" style="padding:30px"><span class="et">未找到匹配房间</span></div>';bindTree();updateIndeterminate();document.getElementById('selectedCount').textContent='已选择 '+selectedRooms.size+' 个房间';}
function idsForBuilding(name){return allRooms.filter(function(room){return room.bld===name;}).map(function(room){return room.id;});}function idsForFloor(key){var parts=key.split('|');return allRooms.filter(function(room){return room.bld===parts[0]&&room.fl===parts[1];}).map(function(room){return room.id;});}function setMany(ids,enabled){ids.forEach(function(id){if(enabled)selectedRooms.add(id);else selectedRooms.delete(id);});renderTree();}
function bindTree(){document.querySelectorAll('[data-room]').forEach(function(input){input.onchange=function(){if(input.checked)selectedRooms.add(input.dataset.room);else selectedRooms.delete(input.dataset.room);renderTree();};});document.querySelectorAll('[data-building]').forEach(function(input){input.onchange=function(){setMany(idsForBuilding(input.dataset.building),input.checked);};});document.querySelectorAll('[data-floor]').forEach(function(input){input.onchange=function(){setMany(idsForFloor(input.dataset.floor),input.checked);};});}
function updateIndeterminate(){document.querySelectorAll('[data-building]').forEach(function(input){input.indeterminate=checkState(idsForBuilding(input.dataset.building)).indeterminate;});document.querySelectorAll('[data-floor]').forEach(function(input){input.indeterminate=checkState(idsForFloor(input.dataset.floor)).indeterminate;});}
function openDialog(id){editingId=id||null;var group=id?energy.listGroups().find(function(item){return item.id===id;}):null;document.getElementById('dialogTitle').textContent=group?'编辑群组':'新增群组';document.getElementById('groupName').value=group?group.name:'';document.getElementById('groupRemark').value=group?group.remark:'';document.getElementById('roomSearch').value='';selectedRooms=new Set(group?group.roomIds:[]);renderTree();$modal('groupDialog');}
document.getElementById('addGroup').onclick=function(){openDialog();};document.getElementById('roomSearch').oninput=renderTree;document.getElementById('saveGroup').onclick=function(){try{energy.saveGroup({id:editingId,name:document.getElementById('groupName').value,remark:document.getElementById('groupRemark').value,roomIds:Array.from(selectedRooms)});$modalClose('groupDialog');renderRows();$msg(editingId?'修改成功':'新增成功');}catch(error){$msg(error.message,'error');}};renderRows();
</script></body></html>
