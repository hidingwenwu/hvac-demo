<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>能耗报表</title><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css"></head>
<body>
<div class="energy-page">
  <div class="energy-head"><h1>能耗报表</h1><div class="energy-head-meta energy-no-print">手动查询 · 导出 · 打印</div></div>
  <div class="energy-filter energy-no-print"><div class="fb">
    <div class="fi"><span class="fl">报表类型</span><select id="reportType"><option value="day">能耗日报</option><option value="week">能耗周报</option><option value="month" selected>能耗月报</option><option value="year">能耗年报</option></select></div>
    <div class="fi"><span class="fl">汇总层级</span><select id="reportLevel"><option value="project">项目汇总</option><option value="building">按楼栋</option><option value="tenant">按租户</option><option value="room" selected>按房间</option><option value="group">按群组</option></select></div>
    <div class="fi" id="periodDay"><span class="fl">报告期</span><input type="date" value="2026-08-13"></div>
    <div class="fi" id="periodWeek" style="display:none"><span class="fl">周起始日</span><input type="date" value="2026-08-10"><span class="text-sub">周一</span></div>
    <div class="fi" id="periodMonth"><span class="fl">报告期</span><input type="month" value="2026-08"></div>
    <div class="fi" id="periodYear" style="display:none"><span class="fl">报告期</span><select><option>2026</option><option>2025</option><option>2024</option></select></div>
    <button class="btn btnp" id="queryReport">查询</button><button class="btn" id="exportReport">⬆ 导出 Excel</button><button class="btn" id="printReport">打印</button>
  </div></div>
  <div class="energy-note">本报表仅统计能耗、运行时长及单位时长能耗。</div>
  <section class="energy-panel"><div class="energy-panel-head"><div><div class="energy-panel-title" id="reportTitle">能耗月报</div><div class="energy-panel-sub" id="reportPeriod">2026 年 8 月</div></div></div>
    <div class="tw"><table><thead><tr><th>对象</th><th>总能耗(kWh)</th><th>运行时长(h)</th><th>单位时长能耗(kWh/h)</th><th>环比</th><th>同比</th></tr></thead><tbody id="reportRows"></tbody><tfoot><tr class="energy-total-row"><td>合计</td><td id="reportTotalEnergy" data-value="0">--</td><td id="reportTotalRuntime">--</td><td>--</td><td>--</td><td>--</td></tr></tfoot></table></div><div id="reportPager" class="energy-no-print"></div>
  </section>
</div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_energy-data.js"></script>
<script>
var energy=HvacEnergy,report=null;var reportPg={total:0,page:1,size:10,sizes:[10,20,30,50],onChange:function(){renderRows();}};
var params=new URLSearchParams(location.search);
function fmt(value,digits){return energy.formatNumber(value,digits);}
function dateText(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');}
function addDays(value,amount){var date=new Date(value+'T00:00:00');date.setDate(date.getDate()+amount);return dateText(date);}
function reportRange(){var type=document.getElementById('reportType').value;if(type==='day'){var day=document.querySelector('#periodDay input').value;return {from:day,to:day};}if(type==='week'){var monday=document.querySelector('#periodWeek input').value;return {from:monday,to:addDays(monday,6)};}if(type==='year'){var year=document.querySelector('#periodYear select').value;return {from:year+'-01-01',to:year+'-12-31'};}var month=document.querySelector('#periodMonth input').value,parts=month.split('-');return {from:month+'-01',to:dateText(new Date(Number(parts[0]),Number(parts[1]),0))};}
function syncPeriod(){var type=document.getElementById('reportType').value;['Day','Week','Month','Year'].forEach(function(name){document.getElementById('period'+name).style.display=type===name.toLowerCase()?'flex':'none';});}
function render(){var range=reportRange(),level=document.getElementById('reportLevel').value;report=energy.getReport({level:level,from:range.from,to:range.to});document.getElementById('reportTitle').textContent=document.getElementById('reportType').selectedOptions[0].text;document.getElementById('reportPeriod').textContent=range.from+' 至 '+range.to+' · '+document.getElementById('reportLevel').selectedOptions[0].text;reportPg.page=1;reportPg.total=report.rows.length;$pager('reportPager',reportPg);renderRows();document.getElementById('reportTotalEnergy').dataset.value=report.total.energy;document.getElementById('reportTotalEnergy').textContent=fmt(report.total.energy);document.getElementById('reportTotalRuntime').textContent=fmt(report.total.runtime);}
function renderRows(){var start=(reportPg.page-1)*reportPg.size;document.getElementById('reportRows').innerHTML=report.rows.slice(start,start+reportPg.size).map(function(row,index){var actualIndex=start+index,mom=((actualIndex%5)-2)*1.6,yoy=((actualIndex%4)-1)*1.9;return '<tr><td>'+row.name+'</td><td data-energy="'+row.energy+'">'+fmt(row.energy)+'</td><td>'+fmt(row.runtime)+'</td><td>'+fmt(row.unitEnergy)+'</td><td class="'+(mom>0?'energy-up':'energy-down')+'">'+(mom>0?'↑ ':'↓ ')+Math.abs(mom).toFixed(1)+'%</td><td class="'+(yoy>0?'energy-up':'energy-down')+'">'+(yoy>0?'↑ ':'↓ ')+Math.abs(yoy).toFixed(1)+'%</td></tr>';}).join('')||'<tr><td colspan="6"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';}
document.getElementById('reportType').onchange=function(){syncPeriod();render();};document.getElementById('queryReport').onclick=render;document.getElementById('exportReport').onclick=function(){$msg('导出任务已生成，请稍候下载');};document.getElementById('printReport').onclick=function(){$msg('正在打开浏览器打印预览','info');setTimeout(function(){window.print();},120);};if(params.get('type'))document.getElementById('reportType').value=params.get('type');if(params.get('period')){var period=params.get('period'),type=document.getElementById('reportType').value,target=type==='year'?document.querySelector('#periodYear select'):document.querySelector('#period'+type.charAt(0).toUpperCase()+type.slice(1)+' input');if(target)target.value=period;}syncPeriod();render();
</script></body></html>
