<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>能耗报表</title><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css"></head>
<body>
<div class="energy-page">
  <div class="energy-head"><div class="energy-head-copy"><h1>能耗报表</h1></div></div>
  <div class="energy-filter"><div class="fb">
    <div class="fi"><span class="fl">统计对象</span><span id="objBox"></span></div>
    <div class="fi"><span class="fl">时间粒度</span><select id="granularity" style="width:110px"></select></div>
    <div class="fi"><span class="fl">时间范围</span><span id="rangeBox"></span></div>
    <button class="btn btnp" id="queryReport">查询</button><button class="btn" id="exportReport">导出</button>
  </div></div>
  <div class="tw"><table><thead><tr><th>时间</th><th>能耗(kWh)</th><th>环比</th><th>同比</th></tr></thead><tbody id="reportRows"></tbody><tfoot><tr class="energy-total-row"><td>合计</td><td id="reportTotal" data-value="0">--</td><td>--</td><td>--</td></tr></tfoot></table></div><div id="reportPager"></div>
</div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_energy-data.js"></script><script src="_energy-filter.js"></script>
<script>
var energy=HvacEnergy,result=null,dataWindow=energy.getDataWindow();
var params=new URLSearchParams(location.search);
var pg={total:0,page:1,size:24,sizes:[24,48,96],onChange:function(){renderRows();}};
function fmt(v,d){return energy.formatNumber(v,d==null?1:d);}
var RANGE_MODE={hour:'single',day:'date',month:'month',year:'year'};
var selectedObj='project';
var state={granularity:params.get('gran')||'day',from:params.get('from')||dataWindow.to.slice(0,8)+'01',to:params.get('to')||dataWindow.to};
if(params.get('type')==='hour')state={granularity:'hour',from:dataWindow.to,to:dataWindow.to};
var rangePicker=$erange('rangeBox',{mode:RANGE_MODE[state.granularity]||'date',from:state.from,to:state.to,min:dataWindow.from,max:dataWindow.to,onChange:function(range){state.from=range.from;state.to=range.to;}});
var objSelector=$eobj('objBox',{types:['project','building','floor','room','tenant','group','meter'],onChange:function(id){selectedObj=id;}});
if(params.get('obj')){objSelector.setValue(params.get('obj'));selectedObj=objSelector.getValue();}
function fillGranularities(){var items=energy.getGranularities();document.getElementById('granularity').innerHTML=items.map(function(item){return '<option value="'+item.value+'">'+item.label+'</option>';}).join('');if(!items.some(function(item){return item.value===state.granularity;}))state.granularity='day';document.getElementById('granularity').value=state.granularity;}
function query(){
  var gran=document.getElementById('granularity').value,range=rangePicker.getRange();
  var from=range.from,to=range.to;
  if(gran==='hour')to=from;
  result=energy.queryComparison({obj:selectedObj||'project',granularity:gran,from:from,to:to});
  document.getElementById('reportTotal').dataset.value=result.current.summary.total;
  document.getElementById('reportTotal').textContent=fmt(result.current.summary.total);
  pg.page=1;pg.total=result.rows.length;$pager('reportPager',pg);renderRows();
}
function rateCell(value){if(value==null)return '<td>--</td>';var cls=value>0?'energy-up':value<0?'energy-down':'',arrow=value>0?'↑ ':value<0?'↓ ':'';return '<td class="'+cls+'">'+arrow+Math.abs(value).toFixed(1)+'%</td>';}
function renderRows(){
  var start=(pg.page-1)*pg.size;
  document.getElementById('reportRows').innerHTML=result.rows.slice(start,start+pg.size).map(function(row){return '<tr><td>'+row.label+'</td><td data-energy="'+row.current+'">'+fmt(row.current)+'</td>'+rateCell(row.momRate)+rateCell(row.yoyRate)+'</tr>';}).join('')||'<tr><td colspan="4"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';
}
document.getElementById('granularity').onchange=function(){
  var gran=this.value,range=rangePicker.getRange();
  if(gran==='hour')rangePicker.setRange(range.to,range.to);
  else if(RANGE_MODE[state.granularity]==='single')rangePicker.setRange(range.to.slice(0,8)+'01',range.to);
  rangePicker.setMode(RANGE_MODE[gran]||'date');
  state.granularity=gran;
};
document.getElementById('queryReport').onclick=query;
document.getElementById('exportReport').onclick=function(){var range=rangePicker.getRange(),gran=document.getElementById('granularity').selectedOptions[0].text;$msg('能耗报表（'+gran+'，'+range.from+' 至 '+range.to+'）导出任务已生成');};
fillGranularities();query();
</script>
</body></html>
