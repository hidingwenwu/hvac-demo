<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="icon" type="image/png" href="../assets/logo-icon-dark.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>负荷分析</title><link rel="stylesheet" href="_base.css"><link rel="stylesheet" href="_energy.css"></head>
<body>
<div class="energy-page">
  <div class="energy-head"><div class="energy-head-copy"><h1>负荷分析</h1></div></div>
  <div class="energy-filter"><div class="fb">
    <div class="fi"><span class="fl">统计对象</span><span id="objBox"></span></div>
    <div class="fi"><span class="fl">分析日期</span><span id="dateBox"></span></div>
    <button class="btn btnp" id="queryLoad">查询</button><button class="btn" id="exportLoad">导出</button>
  </div></div>
  <div class="energy-kpis" style="grid-template-columns:repeat(4,minmax(180px,1fr))">
    <div class="energy-kpi"><div class="energy-kpi-label">最大负荷</div><div class="energy-kpi-value" id="maxLoad" data-value="0">--</div><div class="energy-kpi-foot energy-warning" id="maxAt">--</div></div>
    <div class="energy-kpi"><div class="energy-kpi-label">平均负荷</div><div class="energy-kpi-value" id="avgLoad">--</div><div class="energy-kpi-foot">当日 15 分钟点均值</div></div>
    <div class="energy-kpi"><div class="energy-kpi-label">日平均设定温度</div><div class="energy-kpi-value" id="avgSetTemp">--</div><div class="energy-kpi-foot">当日设定温度均值</div></div>
    <div class="energy-kpi"><div class="energy-kpi-label">日平均室内温度</div><div class="energy-kpi-value" id="avgRoomTemp">--</div><div class="energy-kpi-foot">当日室内温度均值</div></div>
  </div>
  <section class="energy-panel" style="margin-bottom:14px"><div class="energy-panel-head"><div><div class="energy-panel-title">日负荷曲线</div></div></div><div class="energy-chart lg" id="loadChart"></div></section>
  <div class="tw"><table><thead><tr><th>时刻</th><th>负荷(kW)</th><th>平均设定温度(℃)</th><th>平均室内温度(℃)</th></tr></thead><tbody id="loadRows"></tbody></table></div><div id="pager"></div>
</div>
<script src="_ui.js"></script><script src="_fleet.js"></script><script src="_allocation.js"></script><script src="_energy-data.js"></script><script src="_energy-filter.js"></script><script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
var energy=HvacEnergy,chart=null,loadResult=null,dataWindow=energy.getDataWindow();
var params=new URLSearchParams(location.search);
var pg={total:0,page:1,size:24,sizes:[24,48,96],onChange:function(){renderRows();}};
function fmt(v,d){return energy.formatNumber(v,d==null?1:d);}
var selectedObj='project';
var datePicker=$erange('dateBox',{mode:'single',from:params.get('date')||dataWindow.to,to:params.get('date')||dataWindow.to,min:dataWindow.from,max:dataWindow.to});
var objSelector=$eobj('objBox',{types:['project','meter','group'],filterGroupType:'meter',onChange:function(id){selectedObj=id;}});
if(params.get('obj')){objSelector.setValue(params.get('obj'));selectedObj=objSelector.getValue();}
function query(){
  loadResult=energy.queryLoad({date:datePicker.getRange().from,obj:selectedObj});
  var s=loadResult.summary,points=loadResult.points;
  document.getElementById('maxLoad').dataset.value=s.max;
  document.getElementById('maxLoad').innerHTML=fmt(s.max)+'<span class="energy-kpi-unit">kW</span>';
  document.getElementById('avgLoad').innerHTML=fmt(s.average)+'<span class="energy-kpi-unit">kW</span>';
  document.getElementById('maxAt').textContent=s.maxAt==='--'?'暂无数据':'发生于 '+s.maxAt;
  var avgSet=points.length?points.reduce(function(sum,p){return sum+p.setTemp;},0)/points.length:null;
  var avgRoom=points.length?points.reduce(function(sum,p){return sum+p.roomTemp;},0)/points.length:null;
  document.getElementById('avgSetTemp').innerHTML=fmt(avgSet)+'<span class="energy-kpi-unit">℃</span>';
  document.getElementById('avgRoomTemp').innerHTML=fmt(avgRoom)+'<span class="energy-kpi-unit">℃</span>';
  renderChart();pg.page=1;pg.total=points.length;$pager('pager',pg);renderRows();
}
function renderChart(){
  var el=document.getElementById('loadChart');
  if(!window.echarts){el.innerHTML='<div class="energy-chart-fallback">图表资源未加载，请联网后刷新<br>负荷指标与明细仍可使用</div>';return;}
  chart=chart||echarts.init(el);
  chart.setOption({tooltip:{trigger:'axis'},legend:{top:0,textStyle:{color:'#aab5ca'}},grid:{left:55,right:55,top:40,bottom:35},xAxis:{type:'category',data:loadResult.points.map(function(p){return p.label;}),axisLabel:{color:'#8492ad',interval:7},axisLine:{lineStyle:{color:'#35415f'}}},yAxis:[{type:'value',name:'kW',axisLabel:{color:'#8492ad'},nameTextStyle:{color:'#8492ad'},splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}}},{type:'value',name:'℃',min:18,max:32,axisLabel:{color:'#8492ad'},nameTextStyle:{color:'#8492ad'},splitLine:{show:false}}],series:[
    {name:'负荷',type:'line',smooth:.2,showSymbol:false,data:loadResult.points.map(function(p){return p.load;}),lineStyle:{width:2,color:'#409eff'},areaStyle:{color:'rgba(64,158,255,.12)'},markPoint:{symbolSize:44,label:{formatter:function(p){return p.value+' kW';}},data:[{type:'max',name:'最大负荷'}]}},
    {name:'平均设定温度',type:'line',yAxisIndex:1,showSymbol:false,data:loadResult.points.map(function(p){return p.setTemp;}),lineStyle:{color:'#e6a23c'}},
    {name:'平均室内温度',type:'line',yAxisIndex:1,showSymbol:false,data:loadResult.points.map(function(p){return p.roomTemp;}),lineStyle:{color:'#67c23a'}}
  ]},true);
}
function renderRows(){
  var start=(pg.page-1)*pg.size;
  document.getElementById('loadRows').innerHTML=loadResult.points.slice(start,start+pg.size).map(function(p){return '<tr><td>'+p.label+'</td><td>'+fmt(p.load)+'</td><td>'+fmt(p.setTemp)+'</td><td>'+fmt(p.roomTemp)+'</td></tr>';}).join('')||'<tr><td colspan="4"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';
}
document.getElementById('queryLoad').onclick=query;
document.getElementById('exportLoad').onclick=function(){$msg('导出任务已生成，请稍候下载');};
window.addEventListener('resize',function(){if(chart)chart.resize();});
query();
</script>
</body>
</html>
