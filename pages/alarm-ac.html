<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>空调故障预警</title>
<link rel="stylesheet" href="_base.css">
<style>
.layout{display:flex;gap:14px;align-items:stretch;min-height:calc(100vh - 32px);}
.side-tree{min-height:100%;}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
/* 档位统计卡(点击快捷筛选) */
.lv-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
.lv-card{background:var(--bg-panel);border-radius:var(--r);padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .15s;border:1px solid transparent;}
.lv-card:hover{background:#182036;}
.lv-card.active{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);}
.lv-card .ll{font-size:13px;color:var(--ts);display:flex;align-items:center;gap:8px;}
.lv-card .ln{font-size:26px;font-weight:600;}
.fault-code{color:var(--primary);cursor:pointer;}
.fault-code:hover{color:var(--primary-hover);}
/* 详情弹窗 */
.detail-grid{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;font-size:13px;}
.detail-grid .k{color:var(--ts);text-align:right;}
.detail-grid .v{color:var(--tx);word-break:break-all;line-height:1.6;}
.advice-box{background:var(--bg-input);border:1px solid var(--bd);border-radius:4px;padding:10px 14px;line-height:1.8;white-space:pre-line;}
.hd-sum{background:var(--bg-input);border:1px solid var(--bd);border-radius:4px;padding:10px 14px;font-size:13px;line-height:1.7;margin-bottom:14px;}
</style>
</head>
<body>
<div class="layout">
  <!-- 左侧建筑物树 -->
  <aside class="side-tree">
    <div class="st-title">建筑物信息</div>
    <div id="tree"></div>
  </aside>

  <!-- 右侧主区 -->
  <div class="main-col">
    <!-- 档位统计卡:点击快捷筛选 -->
    <div class="lv-cards" id="lvCards"></div>

    <!-- 筛选栏 -->
    <div class="fb">
      <div class="fi">
        <select id="fLevel" style="width:150px">
          <option value="">故障档位</option>
          <option value="1">一档·严重故障</option>
          <option value="2">二档·警示</option>
          <option value="3">三档·提示</option>
          <option value="0">已屏蔽</option>
        </select>
      </div>
      <div class="fi"><select id="fBrand" style="width:120px"><option value="">品牌</option></select></div>
      <div class="fi"><input id="fCode" placeholder="故障代码" style="width:130px"></div>
      <div class="fi"><input id="fAddr" placeholder="内机全地址" style="width:150px"></div>
      <div class="fi">
        <select id="fSt" style="width:120px"><option value="">状态</option><option value="new" selected>未处理</option><option value="done">已处理</option><option value="ignored">已忽略</option></select>
      </div>
      <div class="fi"><span class="fl">故障发生时间</span>
        <input type="date" id="fStart" style="width:140px"><span class="text-sub">至</span><input type="date" id="fEnd" style="width:140px">
      </div>
      <button class="btn btnp" onclick="doQuery()">查询</button>
      <button class="btn" onclick="doReset()">重置</button>
    </div>

    <div class="tw">
      <table>
        <thead><tr>
          <th>序号</th><th>楼栋</th><th>楼层</th><th>房间</th><th>内机全地址</th>
          <th>品牌</th><th>故障代码</th><th>故障名称</th><th>故障档位</th>
          <th>故障发生时间</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="pager"></div>
  </div>
</div>

<!-- 故障详情弹窗(联查故障代码库) -->
<div class="modal" id="dlgDetail">
  <div class="dialog" style="width:600px">
    <div class="dh"><span>故障详情</span><span class="dx" onclick="$modalClose('dlgDetail')">✕</span></div>
    <div class="db"><div class="detail-grid" id="detailGrid"></div></div>
    <div class="df">
      <button class="btn" onclick="$modalClose('dlgDetail')">关闭</button>
      <button class="btn" onclick="$modalClose('dlgDetail');$alarmNav('alarm-code-lib')">前往故障代码库</button>
    </div>
  </div>
</div>

<!-- 处理弹窗 -->
<div class="modal" id="dlgHandle">
  <div class="dialog" style="width:520px">
    <div class="dh"><span>处理故障</span><span class="dx" onclick="$modalClose('dlgHandle')">✕</span></div>
    <div class="db">
      <div class="hd-sum" id="handleSum"></div>
      <div class="form-item">
        <span class="fl"><span class="req" style="color:var(--er)">*</span>处理备注</span>
        <textarea id="handleNote" rows="3" placeholder="请填写检修/处理情况说明" style="width:100%"></textarea>
      </div>
      <div class="form-item" style="margin-top:12px">
        <span class="fl">处理人</span>
        <input id="handleBy" value="丁文武" style="width:200px">
      </div>
    </div>
    <div class="df">
      <button class="btn" onclick="$modalClose('dlgHandle')">取消</button>
      <button class="btn btnp" onclick="doHandle()">确认处理</button>
    </div>
  </div>
</div>

<script src="_ui.js"></script>
<script src="_alarm-data.js"></script>
<script>
let treeSel=null;
let lvPick='';                  // 档位统计卡快捷筛选('' 全部)
let filtered=[];
const pg={total:0,page:1,size:10,sizes:[10,20,30,50],onChange:()=>renderTable()};
let handleId=null;

function stOf(r){const s=$alarmStatus(r.id);return s?s.st:'new';}
function stTag(st){
  if(st==='done')return '<span class="tag tok">已处理</span>';
  if(st==='ignored')return '<span class="tag tin">已忽略</span>';
  return '<span class="tag ter">未处理</span>';
}
function lvTag(lv){
  if(lv===0)return '<span class="tag tin">已屏蔽</span>';
  const L=ALARM_LEVELS[lv];
  return `<span class="tag ${L.tag}">${L.lb}</span>`;
}
/* 项目级档位判定(当前项目):0=已屏蔽 */
function lvOf(r){return $alarmFaultLevelProj(r);}

/* ── 建筑树 ── */
function renderTree(){
  $tree3('tree',$tree3From(ALARM_AC_FAULTS),s=>{treeSel=s;doQuery();});
}

/* ── 品牌下拉 ── */
function renderBrands(){
  const brands=[...new Set(ALARM_AC_FAULTS.map(f=>f.brand))];
  document.getElementById('fBrand').innerHTML='<option value="">全部品牌</option>'+brands.map(b=>`<option>${b}</option>`).join('');
}

/* ── 档位统计卡(不含已屏蔽) ── */
function renderLvCards(){
  const st=$alarmStatusAll();
  const cnt={1:0,2:0,3:0};
  ALARM_AC_FAULTS.forEach(f=>{
    const lv=lvOf(f);
    if(lv===0)return;
    if(!st[f.id])cnt[lv]++;
  });
  document.getElementById('lvCards').innerHTML=[1,2,3].map(lv=>{
    const L=ALARM_LEVELS[lv];
    return `<div class="lv-card ${String(lv)===String(lvPick)?'active':''}" onclick="pickLv(${lv})">
      <span class="ll"><span class="dot" style="background:${L.color}"></span>${L.lb}(未处理)</span>
      <span class="ln" style="color:${L.color}">${cnt[lv]}</span>
    </div>`;
  }).join('');
}
function pickLv(lv){
  lvPick=(String(lvPick)===String(lv))?'':String(lv);
  document.getElementById('fLevel').value=lvPick;
  renderLvCards();doQuery();
}

/* ── 查询/表格 ── */
function val(id){return document.getElementById(id).value;}
function doQuery(){
  const lv=val('fLevel'),brand=val('fBrand'),code=val('fCode').trim().toUpperCase(),
        addr=val('fAddr').trim(),st=val('fSt'),s=val('fStart'),e=val('fEnd');
  filtered=ALARM_AC_FAULTS.filter(r=>{
    if(lv!==''&&String(lvOf(r))!==lv)return false;
    if(brand&&r.brand!==brand)return false;
    if(code&&r.code.toUpperCase().indexOf(code)<0)return false;
    if(addr&&!r.addr.includes(addr))return false;
    if(st&&stOf(r)!==st)return false;
    if(s&&r.devTime<s)return false;
    if(e&&r.devTime>e+' 23:59:59')return false;
    return $tree3Match(treeSel,r);
  });
  pg.page=1;pg.total=filtered.length;
  $pager('pager',pg);
  renderLvCards();renderTable();
}
function doReset(){
  ['fCode','fAddr','fStart','fEnd'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fBrand').value='';
  document.getElementById('fSt').value='new';
  lvPick='';document.getElementById('fLevel').value='';
  treeSel=null;renderTree();doQuery();
}

function renderTable(){
  const start=(pg.page-1)*pg.size;
  const rows=filtered.slice(start,start+pg.size);
  document.getElementById('tbody').innerHTML=rows.length?rows.map((r,i)=>{
    const lv=lvOf(r);
    const entry=$alarmProjEntry(r.brand,r.code);
    const st=stOf(r);
    return `<tr>
      <td>${start+i+1}</td><td>${r.bld}</td><td>${r.fl}</td><td>${r.room}</td>
      <td>${r.addr}</td><td>${r.brand}</td>
      <td><span class="fault-code" onclick="showDetail(${start+i})">${r.code}</span></td>
      <td>${entry&&entry.name?entry.name:'<span class="text-wn">未知故障</span>'}</td>
      <td>${lvTag(lv)}</td>
      <td>${r.devTime}</td>
      <td>${stTag(st)}</td>
      <td><span class="op">
        <a onclick="showDetail(${start+i})">详情</a>
        ${st==='new'?`<a onclick="openHandle(${start+i})">处理</a><a class="danger" onclick="doIgnore(${start+i})">忽略</a>`:''}
      </span></td>
    </tr>`;
  }).join('')
  :'<tr><td colspan="12"><div class="empty"><span class="ei">📄</span><span class="et">暂无数据</span></div></td></tr>';
}

/* 详情弹窗:联查代码库(项目级判定:屏蔽/档位调整/项目新增/通用/未收录) */
function showDetail(idx){
  const r=filtered[idx];
  const lv=lvOf(r);
  const uniEntry=$alarmFaultEntry(r);              /* 通用库定义(可能无) */
  const entry=$alarmProjEntry(r.brand,r.code);     /* 项目级合并(选填缺省已回退通用库) */
  const st=stOf(r);
  const sRec=$alarmStatus(r.id);
  const projCfg=$alarmProjCodeGet($alarmCurProj());
  const k=r.brand+'|'+r.code;
  const blocked=projCfg.blocks.includes(k);
  const adjusted=!blocked&&!!projCfg.adds[k]&&!!uniEntry;
  let lvNote;
  if(blocked)lvNote=`本项目已屏蔽该故障码,不产生预警计数与短信推送${uniEntry?`(通用库档位:${ALARM_LEVELS[uniEntry.level].lb})`:''}`;
  else if(adjusted)lvNote=`依据项目新增配置:通用${ALARM_LEVELS[uniEntry.level].short} → 本项目${ALARM_LEVELS[lv].short}`;
  else if(uniEntry)lvNote=`依据通用代码库:${uniEntry.brand}-${uniEntry.code}`;
  else if(projCfg.adds[k])lvNote='依据项目新增监测码(通用代码库无此码)';
  else lvNote='未收录代码,默认按二档(警示)处理';
  document.getElementById('detailGrid').innerHTML=`
    <span class="k">楼栋:</span><span class="v">${r.bld}</span>
    <span class="k">楼层:</span><span class="v">${r.fl}</span>
    <span class="k">房间:</span><span class="v">${r.room}</span>
    <span class="k">内机全地址:</span><span class="v">${r.addr}</span>
    <span class="k">品牌:</span><span class="v">${r.brand}</span>
    <span class="k">故障代码:</span><span class="v text-er">${r.code}</span>
    <span class="k">故障名称:</span><span class="v">${entry&&entry.name?entry.name:'未知故障'}</span>
    <span class="k">故障档位:</span><span class="v">${lvTag(lv)}<span class="text-sub" style="margin-left:8px">${lvNote}</span></span>
    ${entry&&(entry.desc||entry.advice)?`
    <span class="k">故障说明:</span><span class="v">${entry.desc||'—'}</span>
    <span class="k">排查建议:</span><span class="v"><div class="advice-box">${entry.advice||'—'}</div></span>`
    :(blocked?'':(projCfg.adds[k]
      ?`<span class="k">提示:</span><span class="v text-sub">该项目新增监测码未填写故障原因与排查方法,可在故障代码库中补充。</span>`
      :`<span class="k">提示:</span><span class="v text-wn">该代码未收录进通用代码库,默认按二档(警示)处理,请前往故障代码库补录。</span>`))}
    <span class="k">故障发生时间:</span><span class="v">${r.devTime}</span>
    <span class="k">状态:</span><span class="v">${stTag(st)}</span>
    ${sRec?`<span class="k">处理人:</span><span class="v">${sRec.by}</span>
    <span class="k">处理时间:</span><span class="v">${sRec.time}</span>
    <span class="k">处理备注:</span><span class="v">${sRec.note||'—'}</span>`:''}`;
  $modal('dlgDetail');
}

/* 处理 / 忽略 */
function openHandle(idx){
  const r=filtered[idx];
  const entry=$alarmProjEntry(r.brand,r.code);
  handleId=r.id;
  const lv=lvOf(r);
  document.getElementById('handleSum').innerHTML=`<b>${r.bld} ${r.fl} ${r.room}</b> · 内机 ${r.addr}<br>${r.brand}-${r.code} ${entry?entry.name:'未知故障'} · ${lv===0?'已屏蔽':ALARM_LEVELS[lv].lb}`;
  document.getElementById('handleNote').value='';
  document.getElementById('handleBy').value='丁文武';
  $modal('dlgHandle');
}
function doHandle(){
  const note=document.getElementById('handleNote').value.trim();
  const by=document.getElementById('handleBy').value.trim();
  if(!note){$msg('请填写处理备注','error');return;}
  if(!by){$msg('请填写处理人','error');return;}
  $alarmSetStatus(handleId,'done',note,by);
  $modalClose('dlgHandle');
  $msg('已标记为已处理');
  doQuery();
}
function doIgnore(idx){
  const r=filtered[idx];
  $confirm(`确定忽略「${r.room} 内机${r.addr} ${r.brand}-${r.code}」吗?忽略后不再计入未处理数。`,()=>{
    $alarmSetStatus(r.id,'ignored','');
    $msg('已忽略');
    doQuery();
  });
}

renderTree();renderBrands();doQuery();
</script>
</body>
</html>
